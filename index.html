<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>VB 매크로 인터랙티브 에디터</title>
<style>
:root {
  --bg: #faf6ee;
  --surface: #ffffff;
  --surface-2: #f6efe0;
  --surface-3: #f3ebd9;
  --border: #e8dec5;
  --border-soft: #f0e8d2;
  --text: #4a3a2a;
  --muted: #8a7d6a;
  --dim: #b7ad97;
  --accent: #f6a5b6;
  --accent-strong: #ec8a9f;
  --accent-2: #a8d4f0;
  --good: #8bc189;
  --warn: #e6a85a;
  --danger: #ec8a87;
  --shadow-sm: 0 1px 4px rgba(74, 58, 42, 0.06);
  --shadow-md: 0 2px 12px rgba(74, 58, 42, 0.08);
  --shadow-lg: 0 6px 24px rgba(74, 58, 42, 0.1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.7;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}
header h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: var(--text);
}
header .tag {
  font-size: 11px;
  color: var(--good);
  background: rgba(139, 193, 137, 0.15);
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 600;
  margin-left: 10px;
}
header .subtitle {
  font-size: 12px;
  color: var(--muted);
}

main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
  gap: 14px;
  padding: 14px;
  overflow: hidden;
  min-height: 0;
}

.credit-footer {
  padding: 8px 16px 10px;
  color: var(--dim);
  font-size: 11.5px;
  text-align: center;
  border-top: 1px solid var(--border-soft);
  background: var(--surface);
  flex-shrink: 0;
}

.panel {
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.panel-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  flex-shrink: 0;
  background: var(--surface);
}
.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  background: var(--bg);
  min-height: 0;
}
.panel-body.code-body {
  padding: 0;
  background: var(--surface);
}

#summary {
  padding: 14px 16px;
  background: var(--bg);
  max-height: 36%;
  overflow-y: auto;
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
}
.summary-empty {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 18px 8px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.summary-card:last-child { margin-bottom: 0; }
.summary-card .one-liner {
  font-size: 14.5px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
  letter-spacing: -0.2px;
}
.summary-card .desc {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 10px;
  font-style: italic;
  line-height: 1.6;
}
.summary-card ul {
  list-style: none;
  padding: 0;
  margin: 6px 0 0;
}
.summary-card ul li {
  font-size: 12.5px;
  padding: 5px 0;
  color: var(--text);
  border-bottom: 1px dashed var(--border-soft);
}
.summary-card ul li:last-child { border-bottom: none; }
.summary-card ul li::before {
  content: "·";
  color: var(--accent);
  font-weight: 800;
  margin-right: 8px;
}
.summary-card .meta {
  margin-top: 8px;
  font-size: 11px;
  color: var(--dim);
}
.summary-alert {
  background: rgba(236, 138, 135, 0.1);
  border: 1px solid rgba(236, 138, 135, 0.35);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  color: var(--text);
  font-size: 12.5px;
}
.summary-alert .alert-title {
  color: var(--danger);
  font-weight: 800;
  margin-bottom: 6px;
}
.summary-alert ul {
  margin: 0;
  padding-left: 18px;
}
.summary-alert li { margin: 3px 0; }

#src {
  flex: 1;
  width: 100%;
  background: transparent;
  color: var(--text);
  border: none;
  outline: none;
  padding: 14px 18px;
  font-family: "D2Coding", "JetBrains Mono", "Fira Code", "Consolas", monospace;
  font-size: 13px;
  line-height: 1.75;
  resize: none;
  white-space: pre;
  overflow: auto;
  tab-size: 4;
  min-height: 0;
  position: relative;
  z-index: 2;
}
#src::selection { background: rgba(246, 165, 182, 0.55); color: var(--text); }
#src::-moz-selection { background: rgba(246, 165, 182, 0.55); color: var(--text); }

.src-wrap {
  flex: 1;
  position: relative;
  background: var(--surface);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.src-highlight {
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  background: rgba(246, 165, 182, 0.32);
  border-left: 3px solid var(--accent);
  z-index: 1;
  opacity: 0;
  transition: opacity 0.2s, top 0.12s ease-out;
}
.src-highlight.visible { opacity: 1; }

.notice {
  background: rgba(168, 212, 240, 0.18);
  border: 1px solid rgba(168, 212, 240, 0.4);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.65;
}
.notice b { color: #4a90c8; }

.sample-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
.sample-tools select {
  width: 170px;
  border: 1.5px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  padding: 7px 30px 7px 12px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
.sample-tools select:focus { border-color: var(--accent); }

.change-panel {
  background: rgba(139, 193, 137, 0.12);
  border: 1px solid rgba(139, 193, 137, 0.35);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 14px;
  color: var(--text);
}
.change-panel-title {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--good);
  margin-bottom: 8px;
}
.change-panel ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.change-panel li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px dashed rgba(139, 193, 137, 0.25);
  font-size: 12px;
}
.change-panel li:last-child { border-bottom: none; }
.change-panel .change-name {
  min-width: 88px;
  color: var(--text);
  font-weight: 700;
}
.change-panel .change-values {
  color: var(--muted);
  min-width: 0;
  overflow-wrap: anywhere;
}

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.9;
}
.empty-state .big {
  font-size: 28px;
  margin-bottom: 14px;
  color: var(--accent);
  font-weight: 800;
}

.group {
  margin-bottom: 16px;
}
.group-title {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.3px;
  padding-left: 6px;
  text-transform: none;
}
.group-title .count {
  font-weight: 500;
  color: var(--dim);
  margin-left: 6px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  padding: 13px 15px;
  margin-bottom: 9px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s, transform 0.1s, border-color 0.15s;
  cursor: pointer;
}
.card:hover { box-shadow: var(--shadow-md); }
.card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(246, 165, 182, 0.25), var(--shadow-md);
}
.card .text-input,
.card .number-stepper,
.card .toggle,
.card select,
.card .stepper-btn,
.card .setting-context summary {
  cursor: auto;
}
.card .stepper-btn { cursor: pointer; }
.card .toggle, .card .setting-context summary { cursor: pointer; }
.card.changed {
  border-left: 4px solid var(--accent);
  padding-left: 12px;
  background: linear-gradient(to right, rgba(246, 165, 182, 0.08), var(--surface) 40%);
}

.setting-label {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  letter-spacing: -0.1px;
}
.setting-desc {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
  line-height: 1.55;
}
.setting-help {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--dim);
  line-height: 1.5;
}
.setting-help::before {
  content: "바꾸는 법 · ";
  color: var(--muted);
  font-weight: 700;
}
.validation-warning {
  display: none;
  margin-top: 8px;
  padding: 7px 9px;
  border-radius: 10px;
  background: rgba(230, 168, 90, 0.13);
  color: #9b6829;
  font-size: 11.5px;
  line-height: 1.45;
}
.validation-warning.visible { display: block; }
.setting-label .badge {
  font-size: 10px;
  background: var(--surface-3);
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 500;
}
.setting-label .changed-chip {
  margin-left: auto;
  font-size: 11px;
  color: var(--accent-strong);
  font-weight: 700;
}

.number-stepper {
  display: flex;
  align-items: stretch;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
  transition: border-color 0.15s;
}
.number-stepper:focus-within { border-color: var(--accent); }
.stepper-btn {
  background: var(--surface-2);
  border: none;
  width: 38px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s;
}
.stepper-btn:hover { background: var(--surface-3); }
.stepper-btn:active { background: var(--accent); color: white; }
.number-stepper input[type="number"] {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  text-align: center;
  font-size: 14.5px;
  font-weight: 600;
  font-family: inherit;
  color: var(--text);
  padding: 8px 4px;
  -moz-appearance: textfield;
  min-width: 0;
}
.number-stepper input[type="number"]::-webkit-outer-spin-button,
.number-stepper input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.text-input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  padding: 9px 14px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.text-input:focus { border-color: var(--accent); }
select.text-input {
  cursor: pointer;
  appearance: none;
  background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='none' stroke='%238a7d6a' stroke-width='2' d='M1 1l5 5 5-5'/></svg>") no-repeat right 14px center;
  padding-right: 34px;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.toggle input { display: none; }
.toggle-track {
  display: inline-block;
  width: 44px;
  height: 24px;
  border-radius: 999px;
  background: var(--surface-3);
  position: relative;
  transition: background 0.15s;
  flex-shrink: 0;
}
.toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
  transition: transform 0.18s ease;
}
.toggle input:checked + .toggle-track { background: var(--accent); }
.toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(20px); }
.toggle-text { font-size: 13px; color: var(--text); font-weight: 500; }

.diff-chip {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--surface-2);
  padding: 3px 10px;
  border-radius: 999px;
}
.diff-chip .ov { color: var(--dim); text-decoration: line-through; }
.diff-chip .nv { color: var(--accent-strong); font-weight: 700; }
.diff-chip .arr { color: var(--dim); }

.line-role {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--border-soft);
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.55;
  font-style: italic;
}
.line-role::before {
  content: "이 줄의 역할 · ";
  font-style: normal;
  color: var(--dim);
  font-weight: 600;
}

.advanced {
  margin-top: 4px;
  background: var(--surface-2);
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px dashed var(--border);
}
.advanced > summary {
  cursor: pointer;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.advanced > summary::-webkit-details-marker { display: none; }
.advanced > summary::before {
  content: "▸";
  transition: transform 0.18s;
  color: var(--muted);
  font-size: 11px;
}
.advanced[open] > summary::before { transform: rotate(90deg); }
.advanced > summary .hint {
  font-weight: 400;
  font-size: 11px;
  color: var(--muted);
  margin-left: 6px;
}
.advanced .group:first-of-type { margin-top: 14px; }
.advanced .group-title { padding-left: 4px; }

button.primary {
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  box-shadow: var(--shadow-sm);
  transition: background 0.1s, transform 0.08s, box-shadow 0.1s;
}
button.primary:hover { background: var(--accent-strong); box-shadow: var(--shadow-md); }
button.primary:active { transform: scale(0.97); }
button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

button.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1.5px solid var(--border);
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.1s;
}
button.secondary:hover { background: var(--surface-2); }
button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }

.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border-soft);
  font-size: 11.5px;
  color: var(--muted);
  flex-shrink: 0;
  gap: 10px;
}
.status-bar .info { flex: 1; }
.status-bar .info.good { color: var(--good); font-weight: 600; }
.status-bar .info.error { color: var(--danger); font-weight: 600; }

@media (max-width: 880px) {
  main {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:baseline;">
    <h1>VB 매크로 인터랙티브 에디터</h1>
    <span class="tag">100% 로컬</span>
  </div>
  <span class="subtitle">코드 붙여넣기 → 한국어 설명과 안전한 설정값을 자동으로 보여드려요</span>
</header>

<main>
  <section class="panel">
    <div class="panel-header">
      <span>코드 요약과 원본</span>
      <div class="sample-tools">
        <select id="sample-select" aria-label="샘플 매크로 선택">
          <option value="">샘플 선택</option>
        </select>
        <button id="copy-btn" class="primary">전체 복사</button>
      </div>
    </div>
    <div id="summary">
      <div class="summary-empty">아래에 VBA 코드를 붙여넣으면 여기에 한국어 요약이 나타나요</div>
    </div>
    <div class="src-wrap">
      <textarea id="src" spellcheck="false" placeholder="여기에 VBA 코드를 붙여 넣으세요"></textarea>
      <div id="src-highlight" class="src-highlight"></div>
    </div>
    <div class="status-bar">
      <span id="status" class="info">대기 중 — 코드를 붙여넣으세요</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span>설정값 <span style="font-weight:400;color:var(--muted);font-size:11px;margin-left:4px;">바꾸면 왼쪽 코드가 자동으로 갱신돼요</span></span>
      <button id="reset-btn" class="secondary" disabled>모두 초기화</button>
    </div>
    <div id="controls" class="panel-body">
      <div class="empty-state">
        <div class="big">·</div>
        아직 코드를 붙여넣지 않으셨네요.<br>
        왼쪽 칸에 매크로 코드를 붙여 넣으면<br>
        바꿀 수 있는 값들을 자동으로 찾아 보여드릴게요.
      </div>
    </div>
  </section>
</main>

<footer class="credit-footer">created by minsu bae</footer>

<script type="module">
"use strict";

const SAMPLE_CODES = [
  {
    id: "basic",
    label: "샘플 1 · 기본",
    code: `' ============================================================
' 샘플 1: 매출 데이터 정리 매크로
' AI에게 "매출 시트의 50000원 초과 행을 표시해줘"로 받은 코드 가정
' ============================================================

Sub 매출데이터정리()
    ' 마지막 행 번호
    Const LAST_ROW = 100

    ' 시트 이름
    Const SHEET_NAME = "매출"

    ' 금액 임계값 (원)
    Const THRESHOLD = 50000

    Dim i As Long
    For i = 2 To LAST_ROW
        If Cells(i, 3).Value > THRESHOLD Then
            Sheets(SHEET_NAME).Range("A1").Value = "확인"
        End If
    Next i

    MsgBox "정리 완료"
End Sub`
  },
  {
    id: "annotated",
    label: "샘플 2 · 어노테이션",
    code: `' ============================================================
' 샘플 2: 어노테이션 사용 — 위젯에 min/max/options 강제 지정
' '@param 라벨 [min=.. max=.. step=.. options=A|B|C]
' ============================================================

Sub 보고서생성()
    ' @param 시작행 min=1 max=10000 step=1
    Const START_ROW = 2

    ' @param 끝행 min=1 max=10000
    Const END_ROW = 500

    ' @param 대상시트 options=매출|매입|재고|인사
    Const SHEET_NAME = "매출"

    ' @param 통과기준
    Const PASS_SCORE = 80

    Dim i As Long
    For i = START_ROW To END_ROW
        If Cells(i, 5).Value >= PASS_SCORE Then
            Sheets(SHEET_NAME).Range("F" & i).Value = "합격"
        Else
            Sheets(SHEET_NAME).Range("F" & i).Value = "미달"
        End If
    Next i

    Dim showAlert As Boolean
    ' @param 알림표시
    showAlert = True

    If showAlert Then
        MsgBox("처리 완료")
    End If
End Sub


Sub 데이터복사()
    ' 원본 시트
    Const FROM_SHEET = "원본"
    ' 대상 시트

function splitIdent(ident) {
  if (!ident) return [];
  if (/[가-힣]/.test(ident)) return [ident];
  const parts = ident.split(/[_\-]+/).filter(Boolean);
  const out = [];
  for (const p of parts) {
    const sub = p.split(/(?<=[a-z])(?=[A-Z])|(?<=[A-Z])(?=[A-Z][a-z])/).filter(Boolean);
    out.push(...sub.map(s => s.toLowerCase()));
  }
  return out;
}

function identToKorean(ident) {
  if (!ident) return null;
  // 단일 문자 변수는 라벨로 부적절 (i, j, k, m, n)
  if (/^[a-zA-Z]$/.test(ident)) return null;
  const parts = splitIdent(ident);
  if (parts.length === 0) return null;
  const mapped = parts.map(p => TERM_KO[p] ?? p);
  return mapped.join(" ");
}

// 토크나이저 (변경 없음)
// ============================================================
const KEYWORDS = new Set([
  "sub","function","end","dim","const","static","public","private",
  "if","then","else","elseif","for","to","step","next","while",
  "wend","do","loop","until","with","set","let","as","byref",
  "byval","optional","true","false","and","or","not","mod",
  "rem","exit","call","new","nothing","redim","preserve","is",
]);

function tokenize(source) {
  const tokens = [];
  const lines = [];
  let i = 0;
  let logicalLineStart = 0;
  let lineTokens = [];
  let inContinuation = false;
  const n = source.length;

  function flushLine(end) {
    lines.push({ start: logicalLineStart, end, tokens: lineTokens });
    lineTokens = [];
    logicalLineStart = end + 1;
  }

  while (i < n) {
    const c = source[i];
    if (c === "\n") {
      if (inContinuation) { inContinuation = false; i++; continue; }
      flushLine(i); i++; continue;
    }
    if (c === "\r") { i++; continue; }
    if (c === " " || c === "\t") { i++; continue; }
    if (c === "'") {
      const start = i;
      while (i < n && source[i] !== "\n") i++;
      const tok = { kind: "comment", start, end: i, raw: source.slice(start, i) };
      tokens.push(tok); lineTokens.push(tok);
      continue;
    }
    if ((c === "R" || c === "r") && lineTokens.filter(t => t.kind !== "comment").length === 0) {
      const m = source.slice(i).match(/^[Rr][Ee][Mm](\b|\s|$)/);
      if (m) {
        const start = i;
        while (i < n && source[i] !== "\n") i++;
        const tok = { kind: "comment", start, end: i, raw: source.slice(start, i) };
        tokens.push(tok); lineTokens.push(tok);
        continue;
      }
    }
    if (c === '"') {
      const start = i; i++;
      while (i < n) {
        if (source[i] === '"') { if (source[i+1] === '"') { i += 2; continue; } i++; break; }
        if (source[i] === "\n") break;
        i++;
      }
      const tok = { kind: "string", start, end: i, raw: source.slice(start, i) };
      tokens.push(tok); lineTokens.push(tok); continue;
    }
    if (c === "&" && (source[i+1] === "H" || source[i+1] === "h")) {
      const start = i; i += 2;
      while (i < n && /[0-9A-Fa-f]/.test(source[i])) i++;
      const tok = { kind: "number", start, end: i, raw: source.slice(start, i), hex: true };
      tokens.push(tok); lineTokens.push(tok); continue;
    }
    if (/[0-9]/.test(c)) {
      const start = i;
      while (i < n && /[0-9]/.test(source[i])) i++;
      if (source[i] === "." && /[0-9]/.test(source[i+1])) {
        i++; while (i < n && /[0-9]/.test(source[i])) i++;
      }
      const tok = { kind: "number", start, end: i, raw: source.slice(start, i) };
      tokens.push(tok); lineTokens.push(tok); continue;
    }
    if (/[A-Za-z_가-힣]/.test(c)) {
      if (c === "_") {
        let j = i + 1;
        while (j < n && (source[j] === " " || source[j] === "\t")) j++;
        if (j < n && source[j] === "\n") { inContinuation = true; i = j; continue; }
      }
      const start = i;
      while (i < n && /[A-Za-z0-9_가-힣]/.test(source[i])) i++;
      const raw = source.slice(start, i);
      const lower = raw.toLowerCase();
      let kind = "ident";
      if (KEYWORDS.has(lower)) kind = "keyword";
      if (lower === "true" || lower === "false") kind = "bool";
      const tok = { kind, start, end: i, raw, lower };
      tokens.push(tok); lineTokens.push(tok); continue;
    }
    const two = source.slice(i, i+2);
    if (two === "<=" || two === ">=" || two === "<>" || two === ":=") {
      const tok = { kind: two === ":=" ? "punct" : "op", start: i, end: i+2, raw: two };
      tokens.push(tok); lineTokens.push(tok); i += 2; continue;
    }
    if ("=<>+-*/\\&^".includes(c)) {
      const tok = { kind: "op", start: i, end: i+1, raw: c };
      tokens.push(tok); lineTokens.push(tok); i++; continue;
    }
    if ("(),.:;".includes(c)) {
      const tok = { kind: "punct", start: i, end: i+1, raw: c };
      tokens.push(tok); lineTokens.push(tok); i++; continue;
    }
    i++;
  }
  if (lineTokens.length > 0 || logicalLineStart < n) flushLine(n);
  return { tokens, lines, source };
}

// ============================================================
// 라인 분류 + 컨텍스트 부착
// ============================================================
function classifyLine(line) {
  const toks = line.tokens.filter(t => t.kind !== "comment");
  if (toks.length === 0) return { kind: "blank" };
  const first = toks[0]; const second = toks[1];
  if (first.kind === "keyword") {
    const k = first.lower;
    if (k === "sub" || k === "function") return { kind: "subStart" };
    if ((k === "private" || k === "public" || k === "static") && second?.kind === "keyword") {
      const k2 = second.lower;
      if (k2 === "sub" || k2 === "function") return { kind: "subStart" };
      if (k2 === "const" || k2 === "dim" || k2 === "static") return { kind: "decl", declKind: k2 };
    }
    if (k === "end" && second?.kind === "keyword") {
      if (second.lower === "sub" || second.lower === "function") return { kind: "subEnd" };
      if (second.lower === "if") return { kind: "endIf" };
      if (second.lower === "with") return { kind: "endWith" };
    }
    if (k === "const" || k === "dim") return { kind: "decl", declKind: k };
    if (k === "if") return { kind: "if" };
    if (k === "elseif") return { kind: "elseIf" };
    if (k === "else") return { kind: "else" };
    if (k === "for") return { kind: "for" };
    if (k === "next") return { kind: "next" };
    if (k === "while" || k === "do") return { kind: "loopStart" };
    if (k === "wend" || k === "loop") return { kind: "loopEnd" };
    if (k === "with") return { kind: "with" };
  }
  return { kind: "stmt" };
}

function annotateLines(parsed) {
  let currentSub = null;
  let currentSection = null;
  for (const line of parsed.lines) {
    line.classification = classifyLine(line);
    if (line.classification.kind === "subStart") {
      const toks = line.tokens.filter(t => t.kind !== "comment");
      const nameTok = toks.find(t => t.kind === "ident");
      currentSub = nameTok ? nameTok.raw : "(이름없음)";
      currentSection = null;
    }
    line.sub = currentSub;
    if (line.classification.kind === "subEnd") { currentSub = null; currentSection = null; }
  }

  for (let i = 0; i < parsed.lines.length; i++) {
    const line = parsed.lines[i];
    line.leadingComment = null;
    line.annotation = null;
    line.sectionHeader = null;

    let prevIdx = i - 1;
    while (prevIdx >= 0 && parsed.lines[prevIdx].classification.kind === "blank") prevIdx--;
    if (prevIdx < 0) continue;
    const prev = parsed.lines[prevIdx];
    const prevToks = prev.tokens.filter(t => t.kind !== "comment");
    if (prevToks.length === 0 && prev.tokens.length > 0 && prev.tokens[0].kind === "comment") {
      const text = prev.tokens[0].raw.replace(/^'\s*|^[Rr][Ee][Mm]\s+/, "").trim();
      if (text.startsWith("@param")) {
        line.annotation = parseAnnotation(text);
        line.leadingComment = text;
      } else {
        const cleaned = cleanCommentText(text);
        if (cleaned) {
          if (isSectionHeader(text)) line.sectionHeader = cleaned;
          else line.leadingComment = cleaned;
        }
      }
    }
  }

  // 가장 가까운 섹션 헤더(앞쪽으로) 전파
  let lastSection = null;
  for (const line of parsed.lines) {
    if (line.sectionHeader) lastSection = line.sectionHeader;
    if (!line.section) line.section = lastSection;
    if (line.classification.kind === "subStart" || line.classification.kind === "subEnd") lastSection = null;
  }
}

function isSectionHeader(text) {
  // ===== 1. 제목 =====, ----- 제목 -----, ##### 제목 #####
  return /^[=\-_*#~]{2,}/.test(text) || /[=\-_*#~]{2,}\s*$/.test(text) ||
         /^\d+[\.\)]\s+/.test(text);
}

function cleanCommentText(text) {
  if (!text) return null;
  let t = text.trim();
  // 양쪽 장식 제거: ===== 1. 제목 =====
  t = t.replace(/^[=\-_*#~]{2,}\s*/, "").replace(/\s*[=\-_*#~]{2,}$/, "").trim();
  // 앞 번호 제거: "1. "
  t = t.replace(/^\d+[\.\)]\s+/, "").trim();
  return t || null;
}

function parseAnnotation(comment) {
  const rest = comment.slice("@param".length).trim();
  if (!rest) return null;
  const parts = rest.split(/\s+/);
  const ann = { label: parts[0] };
  for (let i = 1; i < parts.length; i++) {
    const m = parts[i].match(/^(\w+)=(.+)$/);
    if (!m) continue;
    const k = m[1], v = m[2];
    if (k === "min" || k === "max" || k === "step") {
      const n = Number(v); if (!Number.isNaN(n)) ann[k] = n;
    } else if (k === "options") ann.options = v.split("|");
  }
  return ann;
}

// ============================================================
// 추출기 (대폭 확장)
// ============================================================
function isLikelyCodeLogic(tok) {
  if (tok.kind === "string") {
    const v = tok.raw.slice(1, -1);
    if (v === "" || v === " " || v === "\\") return true;
  }
  if (tok.kind === "number") {
    if (tok.hex) return true;
    const n = Number(tok.raw);
    if (n === 0 || n === 1 || n === -1) return true;
  }
  return false;
}

function findConcatStrings(toks) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    if (toks[i].kind !== "string") continue;
    const prev = toks[i-1], next = toks[i+1];
    const v = toks[i].raw.slice(1, -1);
    if (v === "" || v === " " || v === "\\") continue;
    if ((prev?.kind === "op" && prev.raw === "&") ||
        (next?.kind === "op" && next.raw === "&")) {
      out.push(toks[i]);
    }
  }
  return out;
}

function findMathNumbers(toks) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    if (toks[i].kind !== "number" || toks[i].hex) continue;
    const n = Number(toks[i].raw);
    if (!Number.isFinite(n) || n === 0 || n === 1 || n === -1) continue;
    const prev = toks[i-1], next = toks[i+1];
    const isMath = (prev?.kind === "op" && /[+\-*/]/.test(prev.raw)) ||
                   (next?.kind === "op" && /[+\-*/]/.test(next.raw));
    if (isMath) out.push(toks[i]);
  }
  return out;
}

function pickSingleLiteral(toks) {
  const slice = toks.filter(t => t.kind !== "comment");
  if (slice.length === 1) {
    const t = slice[0];
    if (t.kind === "number" || t.kind === "string" || t.kind === "bool") return t;
  }
  return null;
}

function findLhsLabel(toks, opIdx) {
  for (let j = opIdx - 1; j >= 0; j--) {
    const t = toks[j];
    if (t.kind === "comment") continue;
    if (t.kind === "ident") return t.raw;
    if (t.kind === "punct" && t.raw === ".") continue;
    if (t.kind === "punct" && t.raw === ")") {
      let depth = 1;
      for (let m = j - 1; m >= 0; m--) {
        const u = toks[m];
        if (u.kind === "punct" && u.raw === ")") depth++;
        else if (u.kind === "punct" && u.raw === "(") {
          depth--;
          if (depth === 0) { const fn = toks[m-1]; return fn?.kind === "ident" ? fn.raw : null; }
        }
      }
      return null;
    }
    return null;
  }
  return null;
}

function parseNamedArg(argToks) {
  // [ident, :=, value...]
  const t = argToks.filter(x => x.kind !== "comment");
  if (t.length < 3) return null;
  if (t[0].kind !== "ident") return null;
  if (!(t[1].kind === "punct" && t[1].raw === ":=")) return null;
  return { name: t[0].raw, value: t.slice(2) };
}

function makeCtx(line, parsed) {
  return {
    sub: line.sub,
    line: parsed.source.slice(line.start, line.end),
    leadingComment: line.leadingComment,
    annotation: line.annotation,
    sectionHeader: line.section,
  };
}

function extract(parsed) {
  const out = [];
  let counter = 0;
  const nid = () => `ed_${counter++}`;

  for (const line of parsed.lines) {
    const cls = line.classification;
    const ctx = makeCtx(line, parsed);
    const toks = line.tokens;

    if (cls.kind === "decl" && cls.declKind === "const") {
      handleConst(toks, ctx, out, nid);
      continue;
    }
    if (cls.kind === "for") {
      handleFor(toks, ctx, out, nid);
    }
    if (cls.kind === "if" || cls.kind === "elseIf" || cls.kind === "loopStart") {
      handleComparisons(toks, cls, ctx, out, nid);
    }

    handleFunctionCalls(toks, ctx, out, nid);
    handleMsgBoxNoParen(toks, cls, ctx, out, nid);

    if (cls.kind === "stmt" && (line.leadingComment || line.annotation)) {
      handleSimpleAssign(toks, ctx, out, nid);
    }
  }

  return dedup(out);
}

function dedup(eds) {
  const seen = new Set();
  return eds.filter(ed => {
    const key = `${ed.range[0]}-${ed.range[1]}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function handleConst(toks, ctx, out, nid) {
  const eqIdx = toks.findIndex(t => t.kind === "op" && t.raw === "=");
  if (eqIdx < 0) return;
  const lit = pickSingleLiteral(toks.slice(eqIdx + 1));
  if (!lit) return;
  if (lit.kind === "number" && lit.hex) return;
  const constIdx = toks.findIndex(t => t.kind === "keyword" && t.lower === "const");
  let nameTok = null;
  for (let i = constIdx + 1; i < toks.length; i++) {
    if (toks[i].kind === "ident") { nameTok = toks[i]; break; }
  }
  const ed = makeEditable({
    id: nid(), tok: lit, ctx,
    fromConst: true,
    ident: nameTok?.raw,
  });
  if (ed) out.push(ed);
}

function handleFor(toks, ctx, out, nid) {
  const eqIdx = toks.findIndex(t => t.kind === "op" && t.raw === "=");
  const toIdx = toks.findIndex(t => t.kind === "keyword" && t.lower === "to");
  const stepIdx = toks.findIndex(t => t.kind === "keyword" && t.lower === "step");
  const forIdx = toks.findIndex(t => t.kind === "keyword" && t.lower === "for");
  const varTok = forIdx >= 0 && toks[forIdx + 1]?.kind === "ident" ? toks[forIdx + 1] : null;

  if (eqIdx < 0 || toIdx <= eqIdx) return;

  const startToks = toks.slice(eqIdx + 1, toIdx).filter(t => t.kind !== "comment");
  const endToks   = toks.slice(toIdx + 1, stepIdx >= 0 ? stepIdx : toks.length).filter(t => t.kind !== "comment");
  const stepToks  = stepIdx >= 0 ? toks.slice(stepIdx + 1).filter(t => t.kind !== "comment") : null;

  function pushFromExpr(exprToks, role) {
    if (!exprToks || exprToks.length === 0) return;
    if (exprToks.length === 1) {
      const lit = exprToks[0];
      if (lit.kind === "number" && !lit.hex) {
        const ed = makeEditable({
          id: nid(), tok: lit, ctx,
          fromForBound: role,
          forVar: varTok?.raw,
        });
        if (ed) out.push(ed);
      }
      return;
    }
    // 수식 안 숫자
    const nums = findMathNumbers(exprToks);
    for (const lit of nums) {
      const ed = makeEditable({
        id: nid(), tok: lit, ctx,
        fromMath: true,
        fromForBound: role,
        forVar: varTok?.raw,
      });
      if (ed) out.push(ed);
    }
  }

  pushFromExpr(startToks, "start");
  pushFromExpr(endToks, "end");
  if (stepToks) pushFromExpr(stepToks, "step");
}

function handleComparisons(toks, cls, ctx, out, nid) {
  for (let k = 0; k < toks.length - 1; k++) {
    const a = toks[k], b = toks[k+1];
    if (a.kind !== "op") continue;
    if (![">","<",">=","<=","=","<>"].includes(a.raw)) continue;
    if (!(b.kind === "number" || b.kind === "string" || b.kind === "bool")) continue;
    if (isLikelyCodeLogic(b)) continue;
    // 우변이 단일 리터럴인지 확인 (다음 토큰이 다른 표현식의 일부면 skip)
    const next2 = toks[k+2];
    if (next2 && (next2.kind === "ident" || next2.kind === "number" || next2.kind === "string")) continue;
    const lhsLabel = findLhsLabel(toks, k);
    const ed = makeEditable({
      id: nid(), tok: b, ctx,
      fromIfRhs: true,
      lhsLabel,
      compareOp: a.raw,
    });
    if (ed) out.push(ed);
  }
}

function handleFunctionCalls(toks, ctx, out, nid) {
  for (let i = 0; i < toks.length - 1; i++) {
    const a = toks[i], b = toks[i+1];
    if (a.kind !== "ident" || b.kind !== "punct" || b.raw !== "(") continue;
    const fname = a.lower ?? a.raw.toLowerCase();
    if (!FUNC_LABELS[fname] && !SAFE_FUNCS.has(fname)) {
      // 화이트리스트가 아니면 건너뜀 (괄호 매칭만 점프)
      i = jumpPastParen(toks, i + 1);
      continue;
    }

    let depth = 1;
    const args = [[]];
    let j = i + 2;
    while (j < toks.length && depth > 0) {
      const t = toks[j];
      if (t.kind === "punct" && t.raw === "(") { depth++; args[args.length-1].push(t); }
      else if (t.kind === "punct" && t.raw === ")") {
        depth--;
        if (depth === 0) break;
        args[args.length-1].push(t);
      } else if (t.kind === "punct" && t.raw === "," && depth === 1) {
        args.push([]);
      } else {
        args[args.length-1].push(t);
      }
      j++;
    }

    for (let k = 0; k < args.length; k++) {
      processFuncArg(args[k], k, fname, ctx, out, nid);
    }
    i = j;
  }
}

function jumpPastParen(toks, openIdx) {
  let depth = 1;
  for (let j = openIdx + 1; j < toks.length; j++) {
    if (toks[j].kind === "punct" && toks[j].raw === "(") depth++;
    else if (toks[j].kind === "punct" && toks[j].raw === ")") {
      depth--;
      if (depth === 0) return j;
    }
  }
  return toks.length;
}

function processFuncArg(argToks, k, fname, ctx, out, nid) {
  const arg = argToks.filter(t => t.kind !== "comment");
  if (arg.length === 0) return;

  // 명명 인자 (name := value)
  const named = parseNamedArg(arg);
  if (named) {
    const lit = pickSingleLiteral(named.value);
    if (lit && !isLikelyCodeLogic(lit)) {
      const ed = makeEditable({
        id: nid(), tok: lit, ctx,
        fromFuncArg: true,
        funcName: fname, argIndex: k,
        namedArg: named.name,
      });
      if (ed) out.push(ed);
    }
    return;
  }

  // 단일 리터럴
  if (arg.length === 1) {
    const lit = arg[0];
    if (!(lit.kind === "number" || lit.kind === "string" || lit.kind === "bool")) return;
    // 빈 문자열은 모든 함수에서 제외 (가드 / 플레이스홀더)
    if (lit.kind === "string" && lit.raw === '""') return;
    if (isLikelyCodeLogic(lit) && fname !== "msgbox" && fname !== "inputbox") return;

    // 함수별 필터
    if ((fname === "sheets" || fname === "worksheets" || fname === "workbooks") && lit.kind === "number") return;
    if (fname === "instr" && k < 2) return;
    if (fname === "mid" && k === 0) return;
    if ((fname === "left" || fname === "right") && k === 0) return;
    if ((fname === "msgbox" || fname === "inputbox") && k > 0 && lit.kind === "number") return;
    if (fname === "cells" && lit.kind === "number" && Number(lit.raw) <= 1) return;
    // FUNC_LABELS에서 null 위치는 추출 안 함
    const labels = FUNC_LABELS[fname];
    if (labels && labels[k] === null) return;

    const ed = makeEditable({
      id: nid(), tok: lit, ctx,
      fromFuncArg: true, funcName: fname, argIndex: k,
    });
    if (ed) out.push(ed);
    return;
  }

  // 복합 표현식 — 결합 문자열
  for (const lit of findConcatStrings(arg)) {
    const ed = makeEditable({
      id: nid(), tok: lit, ctx,
      fromConcat: true, funcName: fname, argIndex: k,
    });
    if (ed) out.push(ed);
  }
  // 수식 안 숫자
  for (const lit of findMathNumbers(arg)) {
    const ed = makeEditable({
      id: nid(), tok: lit, ctx,
      fromMath: true, funcName: fname, argIndex: k,
    });
    if (ed) out.push(ed);
  }
}

function handleMsgBoxNoParen(toks, cls, ctx, out, nid) {
  if (cls.kind !== "stmt") return;
  const noComm = toks.filter(t => t.kind !== "comment");
  if (noComm.length < 2) return;
  const first = noComm[0];
  if (first.kind !== "ident") return;
  const fn = first.lower ?? first.raw.toLowerCase();
  if (fn !== "msgbox" && fn !== "inputbox") return;
  const second = noComm[1];
  if (second.kind === "punct" && second.raw === "(") return; // 괄호 호출은 handleFunctionCalls에서

  // ',' 구분으로 인자 분할
  const argToks = noComm.slice(1);
  const args = [[]];
  let depth = 0;
  for (const t of argToks) {
    if (t.kind === "punct" && t.raw === "(") { depth++; args[args.length-1].push(t); }
    else if (t.kind === "punct" && t.raw === ")") { depth--; args[args.length-1].push(t); }
    else if (t.kind === "punct" && t.raw === "," && depth === 0) args.push([]);
    else args[args.length-1].push(t);
  }
  for (let k = 0; k < args.length; k++) {
    processFuncArg(args[k], k, fn, ctx, out, nid);
  }
}

function handleSimpleAssign(toks, ctx, out, nid) {
  const t = toks.filter(x => x.kind !== "comment");
  if (t.length !== 3) return;
  if (t[0].kind !== "ident") return;
  if (!(t[1].kind === "op" && t[1].raw === "=")) return;
  const lit = t[2];
  if (!(lit.kind === "number" || lit.kind === "string" || lit.kind === "bool")) return;
  if (isLikelyCodeLogic(lit)) return;
  const ed = makeEditable({
    id: nid(), tok: lit, ctx,
    fromAssign: true, ident: t[0].raw,
  });
  if (ed) out.push(ed);
}

// ============================================================
// makeEditable / 라벨 / 분류
// ============================================================
function makeEditable(opts) {
  const { tok, ctx, id } = opts;
  if (tok.kind === "number" && tok.hex) return null;

  const kind = tok.kind === "number" ? "number" : tok.kind === "string" ? "string" : "bool";
  let value;
  if (kind === "number") {
    value = Number(tok.raw);
    if (Number.isNaN(value)) return null;
  } else if (kind === "string") {
    value = tok.raw.slice(1, -1).replace(/""/g, '"');
  } else {
    value = tok.raw.toLowerCase() === "true";
  }

  const ed = {
    id, kind,
    range: [tok.start, tok.end],
    raw: tok.raw,
    value,
    context: ctx,
    fromConst:    opts.fromConst ?? false,
    fromAssign:   opts.fromAssign ?? false,
    fromForBound: opts.fromForBound ?? null,
    forVar:       opts.forVar ?? null,
    fromIfRhs:    opts.fromIfRhs ?? false,
    lhsLabel:     opts.lhsLabel ?? null,
    compareOp:    opts.compareOp ?? null,
    fromFuncArg:  opts.fromFuncArg ?? false,
    funcName:     opts.funcName ?? null,
    argIndex:     opts.argIndex ?? null,
    namedArg:     opts.namedArg ?? null,
    fromConcat:   opts.fromConcat ?? false,
    fromMath:     opts.fromMath ?? false,
    ident:        opts.ident ?? null,
  };

  ed.label       = labelFor(ed);
  ed.description = describe(ed);
  ed.beginnerHint = beginnerHint(ed);
  ed.lineRole    = lineRole(ed);
  ed.tier        = classifyTier(ed);
  ed.category    = categorize(ed);
  ed.hint        = computeHint(ed);
  return ed;
}

// ============================================================
// 줄 역할 설명 (이 줄이 무슨 일을 하는 코드인지)
// ============================================================
function excelTargetName(line) {
  if (/\bPivot(Cache|Caches|Table|Tables|Field|Fields|Item|Items)\b/i.test(line)) return "피벗테이블";
  if (/\b(Chart|Charts|ChartObject|ChartObjects)\b/i.test(line)) return "차트";
  if (/\b(SlicerCache|SlicerCaches|Slicer)\b/i.test(line)) return "슬라이서";
  if (/\.(Rows|EntireRow)\s*(\(|\.)/i.test(line)) return "행";
  if (/\.(Columns|EntireColumn)\s*(\(|\.)/i.test(line)) return "열";
  if (/\.(Cells)\s*\(/i.test(line) || /\bCells\s*\(/i.test(line)) return "셀";
  if (/\.(Range)\s*\(/i.test(line) || /\bRange\s*\(/i.test(line)) return "셀 범위";
  if (/\.(Sheets|Worksheets)\s*\(/i.test(line) || /\b(Sheets|Worksheets)\s*\(/i.test(line)) return "시트";
  if (/\bWorkbooks\s*\(/i.test(line) || /\bActiveWorkbook\b|\bThisWorkbook\b/i.test(line)) return "통합문서";
  return "대상";
}

function hasExcelTarget(line) {
  return /\.(Range|Cells|Rows|Columns|EntireRow|EntireColumn|Sheets|Worksheets)\s*(\(|\.)/i.test(line)
    || /\b(Range|Cells|Rows|Columns|Sheets|Worksheets)\s*\(/i.test(line)
    || /\b(PivotCaches|PivotTables|PivotFields|PivotItems|SlicerCaches|ChartObjects|Charts)\s*\(/i.test(line)
    || /\b(ActiveSheet|ActiveWorkbook|ThisWorkbook)\b/i.test(line);
}

function explainOfficeAutomationAction(line) {
  // Excel 피벗/분석 자동화
  if (/\bPivotCaches\.Create\b/i.test(line)) return "피벗테이블을 만들 원본 데이터 캐시를 준비해요";
  if (/\.CreatePivotTable\b/i.test(line)) return "원본 데이터로 새 피벗테이블을 만들어요";
  if (/\.PivotTableWizard\b/i.test(line)) return "선택한 데이터로 피벗테이블을 만들어요";
  if (/\bPivotTables\s*\(.*\)\.RefreshTable\b/i.test(line)) return "피벗테이블 데이터를 새로 고쳐요";
  if (/\bPivotTables\s*\(.*\)\.ChangePivotCache\b/i.test(line)) return "피벗테이블의 원본 데이터 범위를 바꿔요";
  if (/\bPivotTables\s*\(.*\)\.ClearTable\b/i.test(line)) return "피벗테이블의 필드 배치를 비워요";
  if (/\bPivotTables\s*\(.*\)\.PivotCache\.Refresh\b/i.test(line)) return "피벗테이블의 원본 데이터를 새로 고쳐요";
  if (/\.AddDataField\b/i.test(line)) return "피벗테이블에 값 필드를 추가해요";
  if (/\.CalculatedFields\.Add\b/i.test(line)) return "피벗테이블에 계산 필드를 추가해요";
  if (/\bPivotFields\s*\(.*\)\.Orientation\s*=/i.test(line)) return "피벗 필드를 행/열/값/필터 영역 중 어디에 둘지 정해요";
  if (/\bPivotFields\s*\(.*\)\.Position\s*=/i.test(line)) return "피벗 필드의 표시 순서를 정해요";
  if (/\bPivotFields\s*\(.*\)\.Function\s*=/i.test(line)) return "피벗 값 필드의 집계 방식(합계, 개수 등)을 정해요";
  if (/\bPivotFields\s*\(.*\)\.NumberFormat\s*=/i.test(line)) return "피벗 값 필드의 표시 형식을 바꿔요";
  if (/\bPivotItems\s*\(.*\)\.Visible\s*=/i.test(line)) return "피벗 항목을 보이거나 숨겨요";
  if (/\bSlicerCaches\.Add/i.test(line) || /\bSlicerCaches\.Add2/i.test(line)) return "피벗테이블에 연결할 슬라이서를 만들어요";
  if (/\bSlicerCaches\s*\(.*\)\.ClearManualFilter\b/i.test(line)) return "슬라이서에서 수동 필터를 지워요";
  if (/\bActiveWorkbook\.RefreshAll\b/i.test(line) || /\.RefreshAll\b/i.test(line)) return "통합문서의 쿼리, 연결, 피벗 데이터를 모두 새로 고쳐요";
  if (/\bQueryTables\.Add\b/i.test(line)) return "외부 데이터 연결 쿼리를 시트에 추가해요";
  if (/\bListObjects\.Add\b/i.test(line)) return "범위를 엑셀 표로 만들거나 외부 데이터 표를 추가해요";
  if (/\bListObjects\s*\(.*\)\.QueryTable\.Refresh\b/i.test(line)) return "표에 연결된 외부 데이터를 새로 고쳐요";
  if (/\bListObjects\s*\(.*\)\.Resize\b/i.test(line)) return "엑셀 표의 범위를 새 크기로 조정해요";
  if (/\bChartObjects\.Add\b/i.test(line) || /\bCharts\.Add\b/i.test(line)) return "새 차트를 만들어요";
  if (/\.SetSourceData\b/i.test(line)) return "차트에 사용할 원본 데이터 범위를 지정해요";
  if (/\.ChartType\s*=/i.test(line)) return "차트 종류를 바꿔요";
  if (/\.HasTitle\s*=/i.test(line)) return "차트 제목 표시 여부를 정해요";
  if (/\.ChartTitle\.Text\s*=/i.test(line)) return "차트 제목 문구를 바꿔요";
  if (/\.Axes\s*\(.*\)\.HasTitle\s*=/i.test(line)) return "차트 축 제목 표시 여부를 정해요";
  if (/\.Export\b/i.test(line) && /\bChart/i.test(line)) return "차트를 이미지 파일로 내보내요";

  // PowerPoint 자동화
  if (/\bCreateObject\s*\(\s*"PowerPoint\.Application"/i.test(line)) return "PowerPoint 프로그램을 새로 실행해요";
  if (/\bGetObject\s*\(.*"PowerPoint\.Application"/i.test(line)) return "이미 실행 중인 PowerPoint에 연결해요";
  if (/\bPresentations\.Open\b/i.test(line)) return "PowerPoint 프레젠테이션 파일을 열어요";
  if (/\bPresentations\.Add\b/i.test(line)) return "새 PowerPoint 프레젠테이션을 만들어요";
  if (/\bPresentations\s*\(.*\)\.Close\b/i.test(line) || /\.Presentation\.Close\b/i.test(line)) return "PowerPoint 프레젠테이션을 닫아요";
  if (/\.Slides\.Add\b/i.test(line) || /\bSlides\.Add\b/i.test(line)) return "프레젠테이션에 새 슬라이드를 추가해요";
  if (/\bSlides\s*\(.*\)\.Delete\b/i.test(line)) return "선택한 슬라이드를 삭제해요";
  if (/\bSlides\s*\(.*\)\.MoveTo\b/i.test(line)) return "슬라이드 순서를 옮겨요";
  if (/\bSlides\s*\(.*\)\.Copy\b/i.test(line)) return "슬라이드를 복사해요";
  if (/\bSlides\s*\(.*\)\.Export\b/i.test(line)) return "슬라이드를 이미지 파일로 내보내요";
  if (/\.Shapes\.PasteSpecial\b/i.test(line)) return "복사한 엑셀 표나 차트를 슬라이드에 특별한 형식으로 붙여넣어요";
  if (/\.Shapes\.Paste\b/i.test(line)) return "복사한 내용을 슬라이드에 붙여넣어요";
  if (/\.Shapes\.AddPicture\b/i.test(line)) return "슬라이드에 그림 파일을 넣어요";
  if (/\.Shapes\.AddChart/i.test(line)) return "슬라이드에 차트를 추가해요";
  if (/\.Shapes\.AddTable/i.test(line)) return "슬라이드에 표를 추가해요";
  if (/\.Shapes\.AddTextbox/i.test(line)) return "슬라이드에 텍스트 상자를 추가해요";
  if (/\bShapes\s*\(.*\)\.TextFrame.*\.Text\s*=/i.test(line)) return "슬라이드 도형 안의 텍스트를 바꿔요";
  if (/\bShapes\s*\(.*\)\.(Left|Top|Width|Height)\s*=/i.test(line)) return "슬라이드 도형의 위치나 크기를 조정해요";
  if (/\bShapes\s*\(.*\)\.Delete\b/i.test(line)) return "슬라이드 도형을 삭제해요";
  if (/\bShapes\s*\(.*\)\.Copy\b/i.test(line)) return "슬라이드 도형을 복사해요";
  if (/\.SlideShowSettings\.Run\b/i.test(line)) return "PowerPoint 슬라이드 쇼를 실행해요";
  if (/\.ExportAsFixedFormat\b/i.test(line) && /(Presentation|Presentations|ppt|PowerPoint)/i.test(line)) return "프레젠테이션을 PDF 같은 고정 형식 파일로 내보내요";
  if (/\.SaveAs\b/i.test(line) && /(Presentation|Presentations|ppt|PowerPoint)/i.test(line)) return "PowerPoint 파일을 다른 이름이나 형식으로 저장해요";

  return null;
}

function explainExcelVbaAction(line) {
  const target = excelTargetName(line);
  const officeAction = explainOfficeAutomationAction(line);
  if (officeAction) return officeAction;

  // 값 읽기/쓰기
  if (/=\s*.+\.(Range|Cells)\s*\(.*\)\.(Value|Value2|Text)\s*$/i.test(line)
      || /=\s*(Range|Cells)\s*\(.*\)\.(Value|Value2|Text)\s*$/i.test(line)) {
    return `${target}의 값을 읽어와 변수에 담아요`;
  }
  if (/\.(Range|Cells)\s*\(.*\)\.(Value|Value2)\s*=/i.test(line)
      || /\b(Range|Cells)\s*\(.*\)\.(Value|Value2)\s*=/i.test(line)) {
    return `${target}에 값을 써넣어요`;
  }
  if (/\.(Range|Cells)\s*\(.*\)\.Formula(R1C1)?\s*=/i.test(line)
      || /\b(Range|Cells)\s*\(.*\)\.Formula(R1C1)?\s*=/i.test(line)) {
    return `${target}에 수식을 넣어요`;
  }

  // 셀/행/열 조작
  const actionRules = [
    [/\.ClearContents\b/i, `${target}의 내용만 지워요`],
    [/\.ClearFormats\b/i, `${target}의 서식만 지워요`],
    [/\.ClearComments\b/i, `${target}의 메모를 지워요`],
    [/\.Clear\b/i, `${target}의 내용과 서식을 지워요`],
    [/\.Copy\b/i, `${target}를 복사해요`],
    [/\.Cut\b/i, `${target}를 잘라내요`],
    [/\.PasteSpecial\b/i, `복사한 내용을 선택한 위치에 특별한 방식으로 붙여넣어요`],
    [/\.Delete\b/i, `${target}를 삭제해요`],
    [/\.Insert\b/i, `${target}를 새로 삽입해요`],
    [/\.Sort\b/i, `${target}를 정렬해요`],
    [/\.AutoFilter\b/i, `${target}에 자동 필터를 적용해요`],
    [/\.Find\s*\(/i, `${target} 안에서 값을 찾아요`],
    [/\.Replace\s*\(/i, `${target} 안의 값을 찾아 바꿔요`],
    [/\.Select\b/i, `${target}를 선택해요`],
    [/\.Activate\b/i, `${target}를 활성화해요`],
    [/\.Merge\b/i, `${target}를 병합해요`],
    [/\.UnMerge\b/i, `병합된 ${target}를 다시 나눠요`],
    [/\.AutoFit\b/i, `${target}의 너비나 높이를 내용에 맞춰 조정해요`],
    [/\.RemoveDuplicates\b/i, `${target}에서 중복 값을 제거해요`],
    [/\.TextToColumns\b/i, `${target}의 텍스트를 여러 열로 나눠요`],
    [/\.Subtotal\b/i, `${target}에 부분합을 넣어요`],
    [/\.AdvancedFilter\b/i, `${target}에 고급 필터를 적용해요`],
    [/\.FillDown\b/i, `${target}의 위쪽 값을 아래로 채워 넣어요`],
    [/\.FillRight\b/i, `${target}의 왼쪽 값을 오른쪽으로 채워 넣어요`],
    [/\.Calculate\b/i, `${target}를 다시 계산해요`],
  ];
  for (const [re, text] of actionRules) {
    if (re.test(line)) return text;
  }

  // 서식 변경
  const formatRules = [
    [/\.NumberFormat(Local)?\s*=/i, `${target}의 표시 형식을 바꿔요`],
    [/\.Interior\.Color(Index)?\s*=/i, `${target}의 배경색을 바꿔요`],
    [/\.Font\.Color(Index)?\s*=/i, `${target}의 글자색을 바꿔요`],
    [/\.Font\.Bold\s*=/i, `${target}의 글자를 굵게 할지 정해요`],
    [/\.Font\.Italic\s*=/i, `${target}의 글자를 기울임으로 할지 정해요`],
    [/\.Font\.Size\s*=/i, `${target}의 글자 크기를 바꿔요`],
    [/\.Font\.Name\s*=/i, `${target}의 글꼴을 바꿔요`],
    [/\.HorizontalAlignment\s*=/i, `${target}의 가로 정렬을 바꿔요`],
    [/\.VerticalAlignment\s*=/i, `${target}의 세로 정렬을 바꿔요`],
    [/\.WrapText\s*=/i, `${target}에서 줄 바꿈 표시 여부를 정해요`],
    [/\.Borders\b/i, `${target}의 테두리 서식을 바꿔요`],
    [/\.RowHeight\s*=/i, `${target}의 행 높이를 바꿔요`],
    [/\.ColumnWidth\s*=/i, `${target}의 열 너비를 바꿔요`],
    [/\.Hidden\s*=/i, `${target}를 숨기거나 다시 보여줘요`],
  ];
  for (const [re, text] of formatRules) {
    if (re.test(line)) return text;
  }

  // 위치/크기 계산
  if (/\.(End|Offset|Resize)\s*\(/i.test(line)) {
    if (/\.End\s*\(\s*xlUp\s*\)/i.test(line)) return "아래쪽에서 위로 올라가며 마지막으로 값이 있는 위치를 찾아요";
    if (/\.End\s*\(\s*xlDown\s*\)/i.test(line)) return "위쪽에서 아래로 내려가며 마지막으로 이어진 값의 위치를 찾아요";
    if (/\.End\s*\(\s*xlToLeft\s*\)/i.test(line)) return "오른쪽에서 왼쪽으로 가며 마지막으로 값이 있는 위치를 찾아요";
    if (/\.End\s*\(\s*xlToRight\s*\)/i.test(line)) return "왼쪽에서 오른쪽으로 가며 마지막으로 이어진 값의 위치를 찾아요";
    if (/\.Offset\s*\(/i.test(line)) return `${target}에서 행이나 열을 이동한 위치를 가리켜요`;
    if (/\.Resize\s*\(/i.test(line)) return `${target}의 크기를 행/열 개수에 맞게 다시 잡아요`;
  }

  // 시트 조작
  if (/\.(Sheets|Worksheets)\s*\(.*\)\.Name\s*=/i.test(line)) return "시트 이름을 바꿔요";
  if (/\.(Sheets|Worksheets)\s*\(.*\)\.Copy\b/i.test(line)) return "시트를 복사해요";
  if (/\.(Sheets|Worksheets)\s*\(.*\)\.Move\b/i.test(line)) return "시트 위치를 옮겨요";
  if (/\.(Sheets|Worksheets)\s*\(.*\)\.Delete\b/i.test(line)) return "시트를 삭제해요";
  if (/\.(Sheets|Worksheets)\s*\(.*\)\.Protect\b/i.test(line)) return "시트를 보호해요";
  if (/\.(Sheets|Worksheets)\s*\(.*\)\.Unprotect\b/i.test(line)) return "시트 보호를 해제해요";
  if (/\.(Sheets|Worksheets)\.Add\b/i.test(line)) return "새 시트를 추가해요";

  // 통합문서/출력
  if (/\bWorkbooks\.Open\b/i.test(line)) return "외부 엑셀 파일을 열어요";
  if (/\bWorkbooks\.Add\b/i.test(line)) return "새 엑셀 파일을 만들어요";
  if (/\.SaveAs\b/i.test(line)) return "파일을 다른 이름이나 위치로 저장해요";
  if (/\.SaveCopyAs\b/i.test(line)) return "현재 파일의 복사본을 저장해요";
  if (/\.Save\b/i.test(line)) return "파일을 저장해요";
  if (/\.Close\s+SaveChanges\s*:?=?\s*False/i.test(line)) return "변경 사항을 저장하지 않고 파일을 닫아요";
  if (/\.Close\s+SaveChanges\s*:?=?\s*True/i.test(line)) return "변경 사항을 저장하고 파일을 닫아요";
  if (/\.Close\b/i.test(line)) return "파일을 닫아요";
  if (/\.PrintOut\b/i.test(line)) return "대상을 인쇄해요";
  if (/\.ExportAsFixedFormat\b/i.test(line)) return "대상을 PDF 같은 고정 형식 파일로 내보내요";
  if (/\.Refresh(All)?\b/i.test(line)) return "연결된 데이터나 쿼리를 새로 고쳐요";

  if (hasExcelTarget(line)) return `${target}를 다루는 Excel VBA 줄이에요`;
  return null;
}

function describeExcelVbaValueUse(ed) {
  const raw = ed.context.line;
  if (!raw) return null;
  const line = raw.trim().replace(/\s*'[^\n]*$/, "").trim();
  const fn = ed.funcName;
  const isRangeLike = fn === "range" || fn === "cells";
  const isSheet = fn === "sheets" || fn === "worksheets";
  const isWorkbook = fn === "workbooks";
  const isPivot = fn === "pivottables" || fn === "pivotfields" || fn === "pivotitems" || fn === "pivotcaches" || fn === "slicercaches";
  const isPresentation = fn === "presentations" || fn === "slides" || fn === "shapes";
  const isChart = fn === "charts" || fn === "chartobjects";

  if (isRangeLike) {
    const unit = fn === "cells" ? "셀" : "범위";
    if (/\.ClearContents\b/i.test(line)) return `이 ${unit}의 내용을 지워요`;
    if (/\.ClearFormats\b/i.test(line)) return `이 ${unit}의 서식을 지워요`;
    if (/\.ClearComments\b/i.test(line)) return `이 ${unit}의 메모를 지워요`;
    if (/\.Clear\b/i.test(line)) return `이 ${unit}의 내용과 서식을 지워요`;
    if (/\.Copy\b/i.test(line)) return `이 ${unit}를 복사해요`;
    if (/\.Cut\b/i.test(line)) return `이 ${unit}를 잘라내요`;
    if (/\.Delete\b/i.test(line)) return `이 ${unit}를 삭제해요`;
    if (/\.Insert\b/i.test(line)) return `이 ${unit} 위치에 새 셀이나 행/열을 넣어요`;
    if (/\.Sort\b/i.test(line)) return `이 ${unit}를 정렬해요`;
    if (/\.AutoFilter\b/i.test(line)) return `이 ${unit}에 필터를 적용해요`;
    if (/\.Find\s*\(/i.test(line)) return `이 ${unit} 안에서 값을 찾아요`;
    if (/\.Replace\s*\(/i.test(line)) return `이 ${unit} 안의 값을 찾아 바꿔요`;
    if (/\.Select\b/i.test(line)) return `이 ${unit}를 선택해요`;
    if (/\.Merge\b/i.test(line)) return `이 ${unit}를 병합해요`;
    if (/\.UnMerge\b/i.test(line)) return `이 ${unit}의 병합을 해제해요`;
    if (/\.PasteSpecial\b/i.test(line)) return `복사한 내용을 이 ${unit}에 특별한 방식으로 붙여넣어요`;
    if (/\.(Value|Value2)\s*=/i.test(line)) return `이 ${unit}에 값을 써넣어요`;
    if (/\.Formula(R1C1)?\s*=/i.test(line)) return `이 ${unit}에 수식을 넣어요`;
    if (/=\s*.+\.(Value|Value2|Text)\s*$/i.test(line)) return `이 ${unit}에서 값을 읽어와요`;
    if (/\.NumberFormat(Local)?\s*=/i.test(line)) return `이 ${unit}의 표시 형식을 바꿔요`;
    if (/\.Interior\.Color(Index)?\s*=/i.test(line)) return `이 ${unit}의 배경색을 바꿔요`;
    if (/\.Font\./i.test(line)) return `이 ${unit}의 글자 서식을 바꿔요`;
    if (/\.Borders\b/i.test(line)) return `이 ${unit}의 테두리 서식을 바꿔요`;
  }

  if (isSheet) {
    if (/\.Delete\b/i.test(line)) return "이 시트를 삭제해요";
    if (/\.Copy\b/i.test(line)) return "이 시트를 복사해요";
    if (/\.Move\b/i.test(line)) return "이 시트 위치를 옮겨요";
    if (/\.Name\s*=/i.test(line)) return "이 시트의 이름을 바꿔요";
    if (/\.Protect\b/i.test(line)) return "이 시트를 보호해요";
    if (/\.Unprotect\b/i.test(line)) return "이 시트의 보호를 해제해요";
    if (/\.Range\s*\(.*\)\.ClearContents\b/i.test(line)) return "이 시트의 지정 범위 내용을 지워요";
    if (/\.Range\s*\(.*\)\.Copy\b/i.test(line)) return "이 시트의 지정 범위를 복사해요";
    if (/\.Range\s*\(.*\)\.(Value|Value2)\s*=/i.test(line)) return "이 시트의 지정 범위에 값을 써넣어요";
  }

  if (isWorkbook) {
    if (/\.Open\b/i.test(line) || /\bWorkbooks\.Open\b/i.test(line)) return "이 엑셀 파일을 열어요";
    if (/\.Close\b/i.test(line)) return "이 엑셀 파일을 닫아요";
    if (/\.Save\b/i.test(line)) return "이 엑셀 파일을 저장해요";
  }

  if (isPivot) {
    if (fn === "pivottables") {
      if (/\.RefreshTable\b/i.test(line)) return "이 피벗테이블 데이터를 새로 고쳐요";
      if (/\.ChangePivotCache\b/i.test(line)) return "이 피벗테이블의 원본 데이터를 바꿔요";
      if (/\.ClearTable\b/i.test(line)) return "이 피벗테이블의 필드 배치를 비워요";
      return "이 이름의 피벗테이블을 대상으로 작업해요";
    }
    if (fn === "pivotfields") {
      if (/\.Orientation\s*=/i.test(line)) return "이 피벗 필드를 행/열/값/필터 영역에 배치해요";
      if (/\.Function\s*=/i.test(line)) return "이 피벗 필드의 집계 방식을 정해요";
      if (/\.NumberFormat\s*=/i.test(line)) return "이 피벗 필드의 표시 형식을 바꿔요";
      return "이 이름의 피벗 필드를 대상으로 작업해요";
    }
    if (fn === "pivotitems") {
      if (/\.Visible\s*=/i.test(line)) return "이 피벗 항목을 보이거나 숨겨요";
      return "이 이름의 피벗 항목을 대상으로 작업해요";
    }
    if (fn === "slicercaches") return "이 슬라이서나 슬라이서 캐시를 대상으로 작업해요";
  }

  if (isChart) {
    if (/\.SetSourceData\b/i.test(line)) return "이 차트에 사용할 원본 데이터를 지정해요";
    if (/\.ChartType\s*=/i.test(line)) return "이 차트의 종류를 바꿔요";
    if (/\.Export\b/i.test(line)) return "이 차트를 이미지 파일로 내보내요";
    return "이 차트를 대상으로 작업해요";
  }

  if (isPresentation) {
    if (fn === "presentations") {
      if (/\.Open\b/i.test(line)) return "이 PowerPoint 파일을 열어요";
      if (/\.Close\b/i.test(line)) return "이 PowerPoint 파일을 닫아요";
      if (/\.SaveAs\b/i.test(line)) return "이 PowerPoint 파일을 저장해요";
      return "이 프레젠테이션을 대상으로 작업해요";
    }
    if (fn === "slides") {
      if (/\.Delete\b/i.test(line)) return "이 슬라이드를 삭제해요";
      if (/\.Copy\b/i.test(line)) return "이 슬라이드를 복사해요";
      if (/\.MoveTo\b/i.test(line)) return "이 슬라이드의 순서를 옮겨요";
      return "이 슬라이드를 대상으로 작업해요";
    }
    if (fn === "shapes") {
      if (/\.TextFrame.*\.Text\s*=/i.test(line)) return "이 도형 안의 텍스트를 바꿔요";
      if (/\.(Left|Top|Width|Height)\s*=/i.test(line)) return "이 도형의 위치나 크기를 조정해요";
      if (/\.Delete\b/i.test(line)) return "이 도형을 삭제해요";
      if (/\.Copy\b/i.test(line)) return "이 도형을 복사해요";
      return "이 슬라이드 도형을 대상으로 작업해요";
    }
  }

  return null;
}

function lineRole(ed) {
  const raw = ed.context.line;
  if (!raw) return null;
  const line = raw.trim().replace(/\s*'[^\n]*$/, "").trim();
  if (!line) return null;

  // 시작/끝
  if (/^(Public\s+|Private\s+|Static\s+|Friend\s+)*(Sub|Function)\b/i.test(line)) return "이 매크로(혹은 함수)의 시작 줄이에요";
  if (/^End\s+(Sub|Function)\b/i.test(line)) return "여기서 매크로가 끝나요";
  if (/^End\s+If\b/i.test(line)) return "조건문 묶음이 여기서 끝나요";
  if (/^End\s+With\b/i.test(line)) return "With 묶음이 여기서 끝나요";
  if (/^Next\b/i.test(line)) return "반복의 끝이에요. 다음 회차로 넘어가요";
  if (/^Wend\b|^Loop\b/i.test(line)) return "반복의 끝이에요";
  if (/^Else\s*$/i.test(line)) return "위 조건이 맞지 않을 때 동작하는 부분이에요";
  if (/^Exit\s+Sub\b/i.test(line)) return "여기서 매크로를 즉시 끝내요";
  if (/^Exit\s+For\b/i.test(line)) return "반복을 즉시 멈추고 빠져나가요";
  if (/^Exit\s+Function\b/i.test(line)) return "함수에서 빠져나가요";

  // 선언
  if (/^Dim\b/i.test(line)) {
    if (/As\s+Workbook\b/i.test(line)) return "통합문서(엑셀 파일)를 담을 변수를 미리 만들어 둬요";
    if (/As\s+Worksheet\b/i.test(line)) return "시트를 담을 변수를 미리 만들어 둬요";
    if (/As\s+(Long|Integer|Double|Single|Byte)\b/i.test(line)) return "숫자를 담을 변수를 미리 만들어 둬요";
    if (/As\s+String\b/i.test(line)) return "텍스트를 담을 변수를 미리 만들어 둬요";
    if (/As\s+Boolean\b/i.test(line)) return "참/거짓을 담을 변수를 미리 만들어 둬요";
    if (/As\s+Variant\b/i.test(line)) return "여러 값(배열 등)을 담을 변수를 미리 만들어 둬요";
    if (/As\s+Range\b/i.test(line)) return "셀 범위를 담을 변수를 미리 만들어 둬요";
    return "사용할 변수를 미리 만들어 두는 줄이에요";
  }
  if (/^(Public\s+|Private\s+)?Const\b/i.test(line)) return "이 매크로 안에서 고정으로 쓸 값을 정해 두는 줄이에요";

  // Set
  if (/^Set\s+\w+\s*=\s*ActiveSheet\b/i.test(line)) return "지금 작업 중인 시트를 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*ActiveWorkbook\b/i.test(line)) return "지금 열려 있는 통합문서를 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*ThisWorkbook\b/i.test(line)) return "지금 매크로가 들어 있는 파일을 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*Workbooks\.Open/i.test(line)) return "외부 엑셀 파일을 열어서 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*.*PivotCaches\.Create\b/i.test(line)) return "피벗테이블을 만들 원본 데이터 캐시를 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*.*CreatePivotTable\b/i.test(line)) return "새로 만든 피벗테이블을 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*.*Presentations\.Open\b/i.test(line)) return "PowerPoint 파일을 열어서 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*.*Presentations\.Add\b/i.test(line)) return "새 PowerPoint 프레젠테이션을 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*.*Slides\.Add\b/i.test(line)) return "새 슬라이드를 만들고 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=\s*.*Shapes\.(Paste|PasteSpecial|AddPicture|AddTextbox|AddChart|AddTable)\b/i.test(line)) return "슬라이드에 넣은 개체를 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=.*\.(Sheets|Worksheets)\s*\(/i.test(line)) return "통합문서 안의 특정 시트를 변수에 담아 둬요";
  if (/^Set\s+\w+\s*=.*\.Range\s*\(/i.test(line)) return "특정 셀 범위를 변수에 담아 둬요";
  if (/^Set\s+/i.test(line)) return "객체(시트, 파일, 셀 등)를 변수에 담아 두는 줄이에요";

  // 화면 갱신 / 옵션
  if (/Application\.ScreenUpdating\s*=\s*False/i.test(line)) return "매크로가 빠르게 끝나도록 화면 깜빡임을 잠깐 멈춰요";
  if (/Application\.ScreenUpdating\s*=\s*True/i.test(line)) return "잠시 멈췄던 화면 갱신을 다시 켜요";
  if (/Application\.Calculation\s*=/i.test(line)) return "엑셀의 자동 계산 모드를 바꿔요";
  if (/Application\.DisplayAlerts\s*=\s*False/i.test(line)) return "확인 메시지가 뜨지 않도록 잠깐 꺼요";
  if (/Application\.DisplayAlerts\s*=\s*True/i.test(line)) return "확인 메시지를 다시 켜요";

  // 닫기 / 저장 (Set 패턴보다 뒤, 일반 호출)
  if (/\.Close\s+SaveChanges\s*:?=?\s*False/i.test(line)) return "변경 사항을 저장하지 않고 파일을 닫아요";
  if (/\.Close\s+SaveChanges\s*:?=?\s*True/i.test(line)) return "변경 사항을 저장하고 파일을 닫아요";
  if (/\.Close\b/i.test(line)) return "파일을 닫아요";
  if (/\.SaveAs\b/i.test(line)) return "파일을 다른 이름이나 위치로 저장해요";
  if (/\.Save\b/i.test(line)) return "파일을 저장해요";

  // For/While/If
  if (/^For\s+Each\b/i.test(line)) return "여러 항목을 하나씩 차례로 살펴보는 반복이에요";
  if (/^For\b/i.test(line)) return "여기서부터 같은 동작을 행마다 차례로 반복해요";
  if (/^If\b.+\bThen\s*$/i.test(line)) return "이 조건이 맞을 때만 아래 줄들을 실행해요";
  if (/^If\b.+\bThen\b/i.test(line)) return "조건이 맞으면 같은 줄에 적힌 동작을 실행해요";
  if (/^ElseIf\b/i.test(line)) return "위 조건이 아닐 때 또 다른 조건을 검사해요";
  if (/^Do\s+While\b/i.test(line)) return "조건이 맞는 동안 계속 반복해요";
  if (/^Do\s+Until\b/i.test(line)) return "조건이 맞을 때까지 계속 반복해요";
  if (/^While\b/i.test(line)) return "조건이 맞는 동안 계속 반복해요";
  if (/^With\b/i.test(line)) return "이 객체에 대한 작업들을 묶어서 처리해요";

  // 메시지/입력
  if (/\bMsgBox\b/i.test(line)) return "메시지를 화면에 띄워서 사용자에게 알려요";
  if (/\bInputBox\b/i.test(line)) return "사용자에게 입력 창을 띄워 값을 받아요";

  // 파일/Dir
  if (/=\s*Dir\s*\(/i.test(line)) return "폴더에서 패턴에 맞는 파일을 찾아 변수에 담아요";
  if (/=\s*ThisWorkbook\.Path/i.test(line) || /=\s*ActiveWorkbook\.Path/i.test(line)) return "지금 매크로가 들어있는 폴더의 경로를 변수에 담아요";

  const excelAction = explainExcelVbaAction(line);
  if (excelAction) return excelAction;

  // InStr (검색)
  if (/\bInStr\s*\(/i.test(line)) return "텍스트 안에서 단어를 찾는 줄이에요";

  // Call
  if (/^Call\b/i.test(line)) return "다른 함수(Sub)를 호출해요";

  // 일반 할당
  if (/^\w+\s*=\s*0\s*$/i.test(line)) return "변수 값을 0으로 초기화해요";
  if (/^\w+\s*=\s*""\s*$/.test(line)) return "변수를 빈 텍스트로 초기화해요";
  if (/^\w+\s*=\s*True\b/i.test(line)) return "이 값을 '참(켜짐)'으로 설정해요";
  if (/^\w+\s*=\s*False\b/i.test(line)) return "이 값을 '거짓(꺼짐)'으로 설정해요";
  if (/^\w+\s*=\s*\w+\s*-\s*1\s*$/.test(line)) return "이전 위치(현재 위치 - 1)를 변수에 저장해요";
  if (/^\w+\s*=\s*\w+\s*\+\s*1\s*$/.test(line)) return "다음 위치(현재 위치 + 1)를 변수에 저장해요";
  if (/^\w+\s*=/i.test(line)) return "변수에 값을 저장하는 줄이에요";

  return "아직 자동 설명이 준비되지 않은 VBA 동작이에요";
}

// ============================================================
// 설명 (이 값이 어떻게 쓰이는지 한 줄로)
// ============================================================
function describe(ed) {
  const fn = ed.funcName;

  if (ed.namedArg) {
    const n = ed.namedArg.toLowerCase();
    if (n === "readonly") return ed.value ? "파일을 수정할 수 없게 열어요" : "파일을 수정할 수 있게 열어요";
    if (n === "savechanges") return ed.value ? "닫을 때 파일을 저장해요" : "닫을 때 저장하지 않고 그냥 닫아요";
    if (n === "matchcase") return ed.value ? "대문자/소문자를 구분해서 찾아요" : "대문자/소문자 상관없이 찾아요";
    if (n === "password") return "이 비밀번호로 파일을 열어요";
    if (n === "filename" || n === "filepath") return "이 위치의 파일을 다뤄요";
    if (n === "destination") return "이 위치에 결과를 넣어요";
    if (n === "sourcedata") return "피벗테이블이나 차트가 사용할 원본 데이터 범위예요";
    if (n === "sourcetype") return "피벗테이블 원본 데이터의 종류를 정해요";
    if (n === "tabledestination") return "피벗테이블을 만들 위치예요";
    if (n === "tablename") return "새 피벗테이블의 이름이에요";
    if (n === "orientation") return "피벗 필드를 행/열/값/필터 중 어디에 둘지 정해요";
    if (n === "position") return "화면에 표시될 순서나 위치예요";
    if (n === "layout") return "새 슬라이드의 레이아웃 종류예요";
    if (n === "left" || n === "top") return "슬라이드나 시트 위에서 개체를 놓을 위치예요";
    if (n === "width" || n === "height") return "개체의 크기를 정해요";
    if (n === "linktofile") return ed.value ? "원본 파일과 연결해서 넣어요" : "원본 파일과 연결하지 않고 넣어요";
    if (n === "savewithdocument") return ed.value ? "파일 안에 함께 저장해요" : "파일 안에 함께 저장하지 않아요";
    if (n === "prompt") return "사용자에게 보여줄 안내 문구예요";
    if (n === "title") return "창의 제목으로 보여줘요";
    if (n === "default") return "사용자가 아무것도 입력하지 않으면 이 값이 들어가요";
  }

  const contextualUse = describeExcelVbaValueUse(ed);
  if (contextualUse) return contextualUse;

  if (ed.fromFuncArg) {
    if (fn === "sheets" || fn === "worksheets") return "이 이름의 시트에서 작업해요";
    if (fn === "workbooks") return "이 이름의 통합문서를 사용해요";
    if (fn === "range") return "이 범위의 셀을 다뤄요 (예: A1, A1:B10)";
    if (fn === "cells") return ed.argIndex === 0 ? "이 행 번호의 셀을 사용해요" : "이 열 번호의 셀을 사용해요";
    if (fn === "msgbox") return "이 메시지를 화면에 띄워요";
    if (fn === "inputbox") return ed.argIndex === 0 ? "사용자에게 보여줄 안내 문구예요" : "창의 제목 등으로 쓰여요";
    if (fn === "dir") return "이런 이름의 파일을 폴더에서 찾아요 (* 는 아무 글자 의미)";
    if (fn === "instr" && ed.argIndex >= 2) return "이 단어가 들어 있는지 검사해요";
    if (fn === "find" || fn === "findnext") return "이 값을 찾아요";
    if (fn === "replace") return ed.argIndex === 0 ? "이 값을 찾아서" : "이 값으로 바꿔요";
    if (fn === "open") return "이 위치의 파일을 열어요";
    if (fn === "pivottables") return "이 이름의 피벗테이블을 대상으로 작업해요";
    if (fn === "pivotfields") return "이 이름의 피벗 필드를 대상으로 작업해요";
    if (fn === "pivotitems") return "이 이름의 피벗 항목을 대상으로 작업해요";
    if (fn === "slicercaches") return "이 이름의 슬라이서를 대상으로 작업해요";
    if (fn === "chartobjects" || fn === "charts") return "이 이름의 차트를 대상으로 작업해요";
    if (fn === "presentations") return "이 이름의 PowerPoint 파일을 대상으로 작업해요";
    if (fn === "slides") return "이 번호의 슬라이드를 대상으로 작업해요";
    if (fn === "shapes") return "이 이름의 슬라이드 도형을 대상으로 작업해요";
  }

  if (ed.fromConcat) {
    if (fn === "range") return "셀 범위 주소의 앞부분이에요. 뒤에 다른 값(예: 행 번호)이 자동으로 붙어요";
    if (fn === "sheets" || fn === "worksheets") return "시트 이름의 일부예요. 뒤에 다른 값이 붙어 완성돼요";
    if (fn === "msgbox" || fn === "inputbox") return "메시지의 일부예요. 다른 값과 합쳐져서 한 문장이 돼요";
    if (fn === "dir") return "찾을 파일 이름이에요 (* 는 아무 글자 의미)";
    return "더 큰 텍스트의 한 부분이에요";
  }

  if (ed.fromMath) {
    if (ed.fromForBound === "end") return "찾는 범위에 추가로 더 살펴볼 행 수예요";
    if (ed.fromForBound === "start") return "시작 위치를 보정하는 숫자예요";
    if (fn === "range" || fn === "cells") return "셀 위치를 계산할 때 더하거나 빼는 숫자예요";
    return "계산식 안에서 사용되는 숫자예요";
  }

  if (ed.fromForBound) {
    if (ed.fromForBound === "start") return "처음에 이 번호부터 차례로 처리해요";
    if (ed.fromForBound === "end") return "이 번호까지 차례로 처리해요";
    if (ed.fromForBound === "step") return "한 번에 몇씩 건너뛸지 정해요";
  }

  if (ed.fromIfRhs) {
    const op = ed.compareOp;
    const lhsKo = ed.lhsLabel && ed.lhsLabel.length > 1 ? identToKorean(ed.lhsLabel) : null;
    const subj = lhsKo || "값";
    if (op === ">") return `${subj}이(가) 이 숫자보다 클 때만 다음 동작을 해요`;
    if (op === "<") return `${subj}이(가) 이 숫자보다 작을 때만 동작해요`;
    if (op === ">=") return `${subj}이(가) 이 숫자 이상일 때만 동작해요`;
    if (op === "<=") return `${subj}이(가) 이 숫자 이하일 때만 동작해요`;
    if (op === "=") return `${subj}이(가) 이 값과 같을 때만 동작해요`;
    if (op === "<>") return `${subj}이(가) 이 값과 다를 때만 동작해요`;
    return "조건을 비교할 때 기준이 되는 값이에요";
  }

  if (ed.fromConst) return "이 매크로 안에서 고정으로 쓰는 값이에요";
  if (ed.fromAssign) return "변수에 저장해서 매크로 안에서 사용하는 값이에요";

  if (ed.kind === "string") return "텍스트 값이에요";
  if (ed.kind === "number") return "숫자 값이에요";
  if (ed.kind === "bool") return ed.value ? "켜진 상태예요" : "꺼진 상태예요";
  return null;
}

function beginnerHint(ed) {
  const raw = ed.context.line || "";
  const line = raw.trim().replace(/\s*'[^\n]*$/, "").trim();
  const fn = ed.funcName;
  const named = ed.namedArg?.toLowerCase();

  if (ed.kind === "bool") {
    if (named === "readonly") return "켜면 파일을 읽기 전용으로 열고, 끄면 매크로가 파일을 수정할 수 있어요.";
    if (named === "savechanges") return "켜면 닫을 때 저장하고, 끄면 저장하지 않고 닫아요.";
    if (named === "linktofile") return "켜면 원본 파일과 연결되고, 끄면 현재 문서 안에 독립적으로 들어가요.";
    if (named === "savewithdocument") return "켜면 그림이나 연결 개체를 문서 안에 함께 저장해요.";
    return "체크하면 True, 체크를 풀면 False로 바뀌어요.";
  }

  if (named) {
    if (named === "filename" || named === "filepath" || named === "path") return "파일 이름만 쓰면 현재 폴더 기준이고, 다른 폴더면 전체 경로를 넣으세요.";
    if (named === "sourcedata") return "원본 표가 커지면 예: '원본!A1:H500'처럼 끝 행/열을 넓혀 주세요.";
    if (named === "tabledestination") return "피벗테이블을 놓을 시작 셀을 예: '피벗!A3'처럼 입력하세요.";
    if (named === "tablename") return "피벗테이블 이름은 같은 파일 안에서 중복되지 않게 적어 주세요.";
    if (named === "orientation") return "행/열/값/필터 위치를 바꾸는 값이라 VBA 상수(xlRowField 등)를 유지하는 편이 안전해요.";
    if (named === "left" || named === "top") return "숫자가 커질수록 오른쪽 또는 아래쪽으로 이동해요.";
    if (named === "width" || named === "height") return "숫자가 커질수록 개체가 더 크게 표시돼요.";
    if (named === "layout") return "슬라이드 레이아웃 번호라서 이미 쓰던 번호를 기준으로만 조금 바꾸는 것이 안전해요.";
  }

  if (fn === "range") {
    if (/\.ClearContents\b/i.test(line)) return "예: A:H는 A열부터 H열 전체 내용을 지워요. 일부 행만 지우려면 A1:H100처럼 행 번호를 넣으세요.";
    if (/\.Copy\b/i.test(line)) return "복사할 범위를 예: A1:H100처럼 지정하세요. A:H처럼 쓰면 열 전체를 복사할 수 있어요.";
    if (/\.(Value|Value2)\s*=/i.test(line)) return "값을 넣을 위치예요. 한 칸이면 A1, 여러 칸이면 A1:H10처럼 입력하세요.";
    if (/\.Sort\b/i.test(line) || /\.AutoFilter\b/i.test(line)) return "머리글까지 포함한 표 전체 범위를 넣어야 정렬/필터가 틀어지지 않아요.";
    return "셀 주소 형식으로 입력하세요. 한 칸은 A1, 범위는 A1:B10, 열 전체는 A:H처럼 씁니다.";
  }

  if (fn === "cells") {
    return ed.argIndex === 0
      ? "행 번호예요. 1은 첫 번째 행이고 숫자가 커질수록 아래쪽 행이에요."
      : "열 번호예요. 1은 A열, 2는 B열, 3은 C열이에요.";
  }

  if (fn === "sheets" || fn === "worksheets") return "엑셀 아래 탭에 보이는 시트 이름과 정확히 같아야 해요.";
  if (fn === "workbooks") return "열려 있는 엑셀 파일 이름과 확장자까지 맞추는 것이 안전해요.";
  if (fn === "dir") return "*는 아무 글자나 허용한다는 뜻이에요. 예: *.xlsx는 엑셀 파일 전체를 찾아요.";
  if (fn === "instr" || fn === "find" || fn === "findnext") return "찾고 싶은 단어를 그대로 넣으세요. 철자와 띄어쓰기가 다르면 못 찾을 수 있어요.";
  if (fn === "replace") return ed.argIndex === 0 ? "찾을 기존 문구를 넣으세요." : "새로 바꿀 문구를 넣으세요.";
  if (fn === "msgbox" || fn === "inputbox") return "사용자에게 그대로 보이는 문구예요. 문장만 바꾸고 따옴표 구조는 유지하세요.";

  if (fn === "pivottables") return "엑셀에서 피벗테이블을 클릭했을 때 보이는 피벗테이블 이름과 같아야 해요.";
  if (fn === "pivotfields") return "원본 데이터의 열 제목 또는 피벗 필드 이름과 정확히 맞춰 주세요.";
  if (fn === "pivotitems") return "피벗 필터 안에 실제로 존재하는 항목 이름을 넣어야 해요.";
  if (fn === "slicercaches") return "슬라이서 이름은 선택 창이나 슬라이서 설정에 있는 이름과 맞춰 주세요.";
  if (fn === "chartobjects" || fn === "charts") return "차트 이름은 선택 창에서 확인한 이름과 같아야 해요.";
  if (fn === "presentations") return "PowerPoint 파일 이름을 확장자까지 맞춰 주세요.";
  if (fn === "slides") return "슬라이드 번호예요. 1은 첫 번째 슬라이드이고 숫자가 커질수록 뒤쪽 슬라이드예요.";
  if (fn === "shapes") return "PowerPoint 선택 창에 보이는 도형 이름과 정확히 같아야 해요.";

  if (ed.fromForBound) {
    if (ed.fromForBound === "start") return "처리를 시작할 번호예요. 첫 행에 제목이 있으면 보통 2부터 시작해요.";
    if (ed.fromForBound === "end") return "처리를 끝낼 번호예요. 너무 작으면 일부 데이터가 빠지고, 너무 크면 빈 행까지 검사할 수 있어요.";
    if (ed.fromForBound === "step") return "1이면 한 줄씩, 2이면 한 줄 건너 한 줄씩 처리해요.";
  }
  if (ed.fromIfRhs) return "조건의 기준값이에요. 숫자를 올리면 통과 조건이 더 엄격해질 수 있어요.";
  if (ed.fromMath) return "위치나 범위를 보정하는 숫자예요. 작게 바꿔서 결과를 확인하는 편이 안전해요.";
  if (ed.kind === "number") return "숫자만 입력하세요. 행 번호, 개수, 위치 값일 수 있으니 크게 바꾸기 전 결과 범위를 확인하세요.";
  if (ed.kind === "string") return "문구만 바꾸세요. 파일명, 시트명, 필드명은 실제 이름과 정확히 같아야 합니다.";
  return null;
}

function contextualLabel(ed) {
  const raw = ed.context.line || "";
  const line = raw.trim().replace(/\s*'[^\n]*$/, "").trim();
  const fn = ed.funcName;
  const named = ed.namedArg?.toLowerCase();

  if (named) {
    if (named === "sourcedata") return "피벗/차트 원본 범위";
    if (named === "tabledestination") return "피벗테이블을 놓을 위치";
    if (named === "tablename") return "새 피벗테이블 이름";
    if (named === "orientation") return "피벗 필드 배치 위치";
    if (named === "layout") return "새 슬라이드 레이아웃";
    if (named === "left") return "개체 왼쪽 위치";
    if (named === "top") return "개체 위쪽 위치";
    if (named === "width") return "개체 너비";
    if (named === "height") return "개체 높이";
  }

  if (fn === "range") {
    if (/\.ClearContents\b/i.test(line)) return "내용을 지울 셀 범위";
    if (/\.ClearFormats\b/i.test(line)) return "서식을 지울 셀 범위";
    if (/\.Clear\b/i.test(line)) return "초기화할 셀 범위";
    if (/\.Copy\b/i.test(line)) return "복사할 셀 범위";
    if (/\.Cut\b/i.test(line)) return "잘라낼 셀 범위";
    if (/\.Delete\b/i.test(line)) return "삭제할 셀 범위";
    if (/\.Sort\b/i.test(line)) return "정렬할 표 범위";
    if (/\.AutoFilter\b/i.test(line)) return "필터를 적용할 표 범위";
    if (/\.Find\s*\(/i.test(line)) return "검색할 셀 범위";
    if (/\.PasteSpecial\b/i.test(line)) return "붙여넣을 시작 범위";
    if (/\.(Value|Value2|Formula)/i.test(line)) return "값을 넣거나 읽을 셀 범위";
    if (/\.SetSourceData\b/i.test(line)) return "차트 원본 셀 범위";
    return null;
  }

  if (fn === "cells") {
    return ed.argIndex === 0 ? "작업할 행 번호" : "작업할 열 번호";
  }
  if (fn === "sheets" || fn === "worksheets") {
    if (/\.Delete\b/i.test(line)) return "삭제할 시트 이름";
    if (/\.Copy\b/i.test(line)) return "복사할 시트 이름";
    if (/\.Range\s*\(/i.test(line)) return "작업할 시트 이름";
    return "시트 이름";
  }
  if (fn === "workbooks") return "작업할 엑셀 파일 이름";
  if (fn === "dir") return "찾을 파일 패턴";
  if (fn === "find" || fn === "findnext" || fn === "instr") return "찾을 문구";
  if (fn === "replace") return ed.argIndex === 0 ? "찾을 기존 문구" : "바꿀 새 문구";
  if (fn === "pivottables") return "작업할 피벗테이블 이름";
  if (fn === "pivotfields") {
    if (/\.Orientation\s*=/i.test(line)) return "배치할 피벗 필드";
    if (/\.Function\s*=/i.test(line)) return "집계 방식을 바꿀 값 필드";
    return "작업할 피벗 필드";
  }
  if (fn === "pivotitems") return "보이거나 숨길 피벗 항목";
  if (fn === "slicercaches") return "작업할 슬라이서 이름";
  if (fn === "chartobjects" || fn === "charts") return "작업할 차트 이름";
  if (fn === "presentations") return "작업할 PowerPoint 파일";
  if (fn === "slides") {
    if (/\.Delete\b/i.test(line)) return "삭제할 슬라이드 번호";
    if (/\.MoveTo\b/i.test(line)) return "옮길 슬라이드 번호";
    return "작업할 슬라이드 번호";
  }
  if (fn === "shapes") {
    if (/\.TextFrame/i.test(line)) return "텍스트를 바꿀 도형 이름";
    if (/\.(Left|Top|Width|Height)\s*=/i.test(line)) return "위치/크기를 바꿀 도형 이름";
    return "작업할 도형 이름";
  }

  return null;
}

function labelFor(ed) {
  const ctx = ed.context;
  // 1. annotation
  if (ctx.annotation?.label) return ctx.annotation.label;
  // 2. leadingComment
  if (ctx.leadingComment && !ctx.leadingComment.startsWith("@param")) {
    const cleaned = cleanCommentText(ctx.leadingComment);
    if (cleaned && cleaned.length <= 30) return cleaned;
  }
  // 3. 명명 인자
  if (ed.namedArg) {
    const contextual = contextualLabel(ed);
    if (contextual) return contextual;
    const lower = ed.namedArg.toLowerCase();
    if (NAMED_ARG_LABELS[lower]) return NAMED_ARG_LABELS[lower];
    const ko = identToKorean(ed.namedArg);
    if (ko) return ko;
    return ed.namedArg;
  }
  // 4. 함수 컨텍스트 라벨
  if (ed.fromFuncArg && ed.funcName) {
    const contextual = contextualLabel(ed);
    if (contextual) return contextual;
    const labels = FUNC_LABELS[ed.funcName];
    if (labels && labels[ed.argIndex]) return labels[ed.argIndex];
  }
  // 5. 결합 문자열
  if (ed.fromConcat) {
    if (ed.funcName === "range") return "셀 범위 (앞부분)";
    if (ed.funcName === "sheets" || ed.funcName === "worksheets") return "시트 이름 (일부)";
    if (ed.funcName === "msgbox" || ed.funcName === "inputbox") return "메시지 (일부)";
    if (ed.funcName === "dir") return "찾을 파일 이름";
    return "텍스트 (일부)";
  }
  // 6. 수식 안 숫자
  if (ed.fromMath) {
    if (ed.fromForBound === "end") return "끝 위치 보정 숫자";
    if (ed.fromForBound === "start") return "시작 위치 보정 숫자";
    if (ed.funcName === "range" || ed.funcName === "cells") return "셀 위치 보정 숫자";
    return "추가 숫자";
  }
  // 7. For 단일 리터럴
  if (ed.fromForBound) {
    const role = ed.fromForBound;
    const varKo = ed.forVar ? identToKorean(ed.forVar) : null;
    const looksLikeRow = (varKo && /행|row/i.test(varKo + (ed.forVar || "")));
    if (role === "end") {
      if (looksLikeRow) return "마지막 행 번호";
      return "끝 번호";
    }
    if (role === "start") {
      if (looksLikeRow) return "처음 시작 행";
      return "시작 번호";
    }
    if (role === "step") return "몇씩 증가";
  }
  // 8. If 비교 우변
  if (ed.fromIfRhs) {
    const lhs = ed.lhsLabel;
    if (lhs && lhs.length > 1) {
      const ko = identToKorean(lhs);
      if (ko) return ko + " 기준 숫자";
    }
    if (ctx.sectionHeader) return ctx.sectionHeader + " 기준";
    return "비교 기준 값";
  }
  // 9. Const / 단순 할당 — 변수명 한국어
  if (ed.fromConst || ed.fromAssign) {
    if (ed.ident) {
      const ko = identToKorean(ed.ident);
      if (ko) return ko;
    }
  }
  // 10. 섹션 헤더 fallback
  if (ctx.sectionHeader) return ctx.sectionHeader;
  // 11. 최후
  return ed.kind === "string" ? "문자열 값" : ed.kind === "bool" ? "켜기/끄기" : "숫자 값";
}

function classifyTier(ed) {
  // 가장 신뢰
  if (ed.context.annotation) return "safe";
  if (ed.fromConst) return "safe";
  if (ed.fromAssign && (ed.context.leadingComment || ed.context.annotation)) return "safe";

  if (ed.fromFuncArg) {
    if (ed.namedArg) return "safe";
    const fn = ed.funcName;
    if (fn && SAFE_FUNCS.has(fn)) {
      // Cells의 좌표는 caution
      if (fn === "cells") return "caution";
      return "safe";
    }
    return "caution";
  }
  if (ed.fromConcat) {
    // 의미 있는 결합 텍스트는 safe
    return "safe";
  }
  if (ed.fromIfRhs) return "caution";
  if (ed.fromForBound) {
    if (ed.fromMath) return "advanced";
    const v = Number(ed.raw);
    if (ed.fromForBound === "end") {
      if (Number.isFinite(v) && v > 10) return "caution";
      return "advanced";
    }
    if (ed.fromForBound === "start") {
      if (Number.isFinite(v) && v >= 3) return "caution";
      return "advanced";
    }
    return "advanced";
  }
  if (ed.fromMath) return "advanced";
  return "advanced";
}

function categorize(ed) {
  // 명명 인자가 file/path 관련이면 file
  if (ed.namedArg) {
    const n = ed.namedArg.toLowerCase();
    if (/file|path|folder|dir/.test(n)) return "file";
    if (/source|table|pivot|chart|field|item|cache/.test(n)) return "data";
    if (/slide|shape|presentation|layout|left|top|width|height/.test(n)) return "presentation";
    if (/sheet|book|range/.test(n)) return "sheet";
    if (/password|key|readonly|matchcase/.test(n)) return "flag";
    if (/prompt|title|message|msg/.test(n)) return "message";
  }
  if (ed.fromFuncArg) {
    const fn = ed.funcName;
    if (fn === "dir" || fn === "open") return "file";
    if (fn === "sheets" || fn === "worksheets" || fn === "workbooks" || fn === "range" || fn === "cells") return "sheet";
    if (fn === "pivottables" || fn === "pivotfields" || fn === "pivotitems" || fn === "pivotcaches" || fn === "slicercaches" || fn === "chartobjects" || fn === "charts") return "data";
    if (fn === "presentations" || fn === "slides" || fn === "shapes") return "presentation";
    if (fn === "instr" || fn === "find" || fn === "findnext" || fn === "replace") return "search";
    if (fn === "msgbox" || fn === "inputbox") return "message";
  }
  if (ed.fromConcat) {
    const fn = ed.funcName;
    if (fn === "range" || fn === "sheets" || fn === "worksheets") return "sheet";
    if (fn === "msgbox" || fn === "inputbox") return "message";
    if (fn === "dir") return "file";
    return "other";
  }
  if (ed.fromIfRhs) return "search";
  if (ed.kind === "bool") return "flag";
  if (ed.kind === "string") {
    // 식별자/변수명 힌트로 추정
    const ident = (ed.ident || ed.lhsLabel || "").toLowerCase();
    if (/file|path|folder|dir/.test(ident)) return "file";
    if (/pivot|chart|query|table|field|item|cache|source/.test(ident)) return "data";
    if (/ppt|powerpoint|presentation|slide|shape/.test(ident)) return "presentation";
    if (/sheet|range|cell/.test(ident)) return "sheet";
    if (/msg|message|alert|info/.test(ident)) return "message";
    return "other";
  }
  if (ed.kind === "number") return "number";
  return "other";
}

function computeHint(ed) {
  const hint = {};
  if (ed.context.annotation) {
    if (typeof ed.context.annotation.min === "number") hint.min = ed.context.annotation.min;
    if (typeof ed.context.annotation.max === "number") hint.max = ed.context.annotation.max;
    if (typeof ed.context.annotation.step === "number") hint.step = ed.context.annotation.step;
    if (ed.context.annotation.options) hint.options = ed.context.annotation.options;
  }
  return hint;
}

  { re: /\bPresentations\.Open\b|\bPresentations\.Add\b/i, text: "PowerPoint 파일을 열거나 만듭니다" },
  { re: /\.Slides\.Add\b|\bSlides\.Add\b/i, text: "슬라이드를 추가합니다" },

  { re: /\.Copy\b/,                       text: "데이터를 복사합니다" },
