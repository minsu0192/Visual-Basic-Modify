  { re: /\bMsgBox\b/i,                    text: "메시지창을 띄웁니다" },
  { re: /\bInputBox\b/i,                  text: "사용자에게 입력을 받습니다" },
  { re: /\bInStr\s*\(/i,                  text: "텍스트를 검색합니다" },
  { re: /\bExit\s+Sub\b/i,                text: "조건에 따라 매크로를 중단합니다" },
  { re: /\bScreenUpdating\s*=\s*False/i,  text: "화면 깜빡임을 막아 속도를 높입니다" },
  { re: /\.Sort\b/i,                      text: "데이터를 정렬합니다" },
  { re: /\.AutoFilter\b/i,                text: "자동 필터를 적용합니다" },
  { re: /\.Delete\b/i,                    text: "값이나 행을 지웁니다" },
  { re: /\.Save\b/i,                      text: "파일을 저장합니다" },
  { re: /\bFor\s+\w+\s*=/i,               text: "여러 행을 순서대로 처리합니다" },
  { re: /\bIf\b.*\bThen\b/i,              text: "조건에 따라 다르게 동작합니다" },

function summarize(parsed) {
  const subs = [];
  let cur = null;
  for (const line of parsed.lines) {
    if (line.classification.kind === "subStart") {
      const toks = line.tokens.filter(t => t.kind !== "comment");
      const nameTok = toks.find(t => t.kind === "ident");
      cur = {
        name: nameTok?.raw ?? "(이름없음)",
        koName: identToKorean(nameTok?.raw ?? "") ?? "",
        firstComment: null,
        actions: [],
        forCount: 0,
        ifCount: 0,
      };
      subs.push(cur);
      continue;
    }
    if (!cur) continue;
    if (line.classification.kind === "subEnd") { cur = null; continue; }

    if (!cur.firstComment && line.tokens.length === 1 && line.tokens[0].kind === "comment") {
      const t = cleanCommentText(line.tokens[0].raw.replace(/^'\s*|^[Rr][Ee][Mm]\s+/, "").trim());
      if (t) cur.firstComment = t;
    }
    if (line.classification.kind === "for") cur.forCount++;
    if (line.classification.kind === "if") cur.ifCount++;

    const text = parsed.source.slice(line.start, line.end);
    for (const p of ACTION_PATTERNS) {
      if (p.re.test(text)) cur.actions.push(p.text);
    }
  }
  for (const s of subs) {
    s.actions = [...new Set(s.actions)];
  }
  return subs;
}

// 렌더링: 오프셋 머지

function valueToRaw(kind, value) {
  if (kind === "number") return String(value);
  if (kind === "string") return `"${String(value).replace(/"/g, '""')}"`;
  if (kind === "bool") return value ? "True" : "False";
  return String(value);
}

function renderSource(source, editables, edits) {
  if (editables.length === 0 || edits.size === 0) return source;
  const sorted = [...editables].sort((a, b) => a.range[0] - b.range[0]);
  let out = "";
  let cursor = 0;
  for (const ed of sorted) {
    if (ed.range[0] < cursor) continue;
    out += source.slice(cursor, ed.range[0]);
    out += edits.has(ed.id) ? edits.get(ed.id) : ed.raw;
    cursor = ed.range[1];
  }
  out += source.slice(cursor);
  return out;
}

const CATEGORY_ORDER = ["file","sheet","data","presentation","search","number","message","flag","other"];
const CATEGORY_NAMES = {
  file:    "파일과 폴더",
  sheet:   "시트와 셀 범위",
  data:    "피벗 / 차트 / 데이터",
  presentation: "PowerPoint",
  search:  "검색과 조건",
  number:  "숫자 설정",
  message: "메시지",
  flag:    "켜기 / 끄기",
  other:   "기타",
};

// ============================================================
// 상태
// ============================================================
const state = {
  source: "",
  editables: [],
  edits: new Map(),
  summary: [],
  risks: [],
};

const $src = document.getElementById("src");
const $controls = document.getElementById("controls");
const $summary = document.getElementById("summary");
const $status = document.getElementById("status");
const $copy = document.getElementById("copy-btn");
const $reset = document.getElementById("reset-btn");
const $highlight = document.getElementById("src-highlight");
const $sampleSelect = document.getElementById("sample-select");

let activeHighlightLine = null;
let activeHighlightLineHeight = 22;
let activeHighlightPadTop = 14;
let activeHighlightLineCount = 1;

function getCurrentOffsets(targetEd) {
  const sorted = [...state.editables].sort((a, b) => a.range[0] - b.range[0]);
  let shift = 0;
  for (const e of sorted) {
    if (e.id === targetEd.id) {
      const start = e.range[0] + shift;
      const len = state.edits.has(e.id) ? state.edits.get(e.id).length : e.raw.length;
      return [start, start + len];
    }
    if (state.edits.has(e.id)) {
      shift += state.edits.get(e.id).length - e.raw.length;
    }
  }
  return [targetEd.range[0] + shift, targetEd.range[1] + shift];
}

function updateHighlightPos() {
  if (activeHighlightLine == null) return;
  const top = activeHighlightLine * activeHighlightLineHeight + activeHighlightPadTop - $src.scrollTop;
  $highlight.style.top = top + "px";
  $highlight.style.height = (activeHighlightLineHeight * activeHighlightLineCount) + "px";
}

function highlightInSource(ed) {
  const [start, end] = getCurrentOffsets(ed);
  const value = $src.value;
  const before = value.slice(0, start);
  const startLine = (before.match(/\n/g) || []).length;
  const inner = value.slice(start, end);
  const lineCount = ((inner.match(/\n/g) || []).length) + 1;

  const cs = getComputedStyle($src);
  const lh = parseFloat(cs.lineHeight) || 22;
  const padTop = parseFloat(cs.paddingTop) || 14;

  activeHighlightLine = startLine;
  activeHighlightLineHeight = lh;
  activeHighlightPadTop = padTop;
  activeHighlightLineCount = lineCount;

  // 화면 중앙쯤으로 스크롤
  const targetTop = startLine * lh + padTop - $src.clientHeight / 2 + lh / 2;
  $src.scrollTop = Math.max(0, targetTop);

  // 위치 갱신 + 표시
  requestAnimationFrame(() => {
    updateHighlightPos();
    $highlight.classList.add("visible");
  });

  // 카드 active 표시
  $controls.querySelectorAll(".card.active").forEach(el => el.classList.remove("active"));
  const card = $controls.querySelector(`[data-widget-id="${ed.id}"]`);
  if (card) card.classList.add("active");
}

$src.addEventListener("scroll", updateHighlightPos);
window.addEventListener("resize", updateHighlightPos);
$src.addEventListener("input", () => {
  // 사용자가 코드 직접 편집하면 강조 숨김
  if (suppressInput) return;
  $highlight.classList.remove("visible");
  activeHighlightLine = null;
  $controls.querySelectorAll(".card.active").forEach(el => el.classList.remove("active"));
});

let analyzeTimer = null;
let suppressInput = false;

function setStatus(msg, kind) {
  $status.textContent = msg;
  $status.className = "info" + (kind ? " " + kind : "");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

function analyzeRisks(parsed) {
  const rules = [
    { re: /\.Delete\b/i, level: "high", text: "삭제 작업이 있습니다. 실행 전 원본 파일을 백업하세요." },
    { re: /\.Clear(Contents|Formats|Comments)?\b/i, level: "high", text: "셀 내용이나 서식을 지우는 작업이 있습니다." },
    { re: /\bKill\s+/i, level: "high", text: "파일을 삭제하는 Kill 명령이 있습니다." },
    { re: /\.SaveAs\b|\.Save\b/i, level: "medium", text: "파일을 저장하는 작업이 있습니다. 기존 파일을 덮어쓸 수 있습니다." },
    { re: /\.Close\s+SaveChanges\s*:?=?\s*True/i, level: "medium", text: "닫을 때 변경 사항을 저장하도록 되어 있습니다." },
    { re: /\bWorkbooks\.Open\b/i, level: "medium", text: "외부 엑셀 파일을 여는 작업이 있습니다. 파일 경로와 권한을 확인하세요." },
    { re: /\bDir\s*\(/i, level: "low", text: "폴더에서 파일을 찾습니다. 파일명이 실제와 다르면 실행이 멈출 수 있습니다." },
    { re: /\bApplication\.DisplayAlerts\s*=\s*False/i, level: "medium", text: "엑셀 확인 메시지를 숨깁니다. 삭제/저장 경고가 보이지 않을 수 있습니다." },
    { re: /\bApplication\.ScreenUpdating\s*=\s*False/i, level: "low", text: "화면 갱신을 끕니다. 오류가 나면 다시 켜는 코드가 실행되지 않을 수 있습니다." },
  ];
  const found = [];
  const seen = new Set();
  for (const line of parsed.lines) {
    const text = parsed.source.slice(line.start, line.end);
    if (!text.trim() || /^\s*'/.test(text)) continue;
    for (const rule of rules) {
      if (!rule.re.test(text)) continue;
      const key = rule.text;
      if (seen.has(key)) continue;
      seen.add(key);
      found.push({ ...rule, line: text.trim() });
    }
  }
  const priority = { high: 0, medium: 1, low: 2 };
  return found.sort((a, b) => priority[a.level] - priority[b.level]).slice(0, 5);
}

function looksLikeCellRange(value) {
  const v = String(value).trim();
  return /^([A-Za-z가-힣0-9_ ]+!)?(\$?[A-Za-z]{1,3}\$?\d+|\$?[A-Za-z]{1,3})(:(\$?[A-Za-z]{1,3}\$?\d+|\$?[A-Za-z]{1,3}))?$/.test(v);
}

function validateEditableValue(ed, value) {
  const warnings = [];
  const text = String(value ?? "").trim();
  const fn = ed.funcName;
  const named = ed.namedArg?.toLowerCase();

  if (ed.kind === "number") {
    const n = Number(value);
    if (!Number.isFinite(n)) warnings.push("숫자만 입력해야 합니다.");
    if ((ed.label.includes("행") || ed.label.includes("번호")) && Number.isFinite(n) && n < 1) {
      warnings.push("행/번호 값은 보통 1 이상이어야 합니다.");
    }
  }

  if (ed.kind === "string") {
    if (text === "" && !/메시지|문구|비밀번호/.test(ed.label)) {
      warnings.push("빈 값이면 VBA가 대상을 찾지 못할 수 있습니다.");
    }
    if (fn === "range" || /range|source|destination|cell|범위|셀/i.test(named || ed.label)) {
      if (text && !looksLikeCellRange(text) && !/[&()]/.test(text)) {
        warnings.push("셀 범위 형식이 맞는지 확인하세요. 예: A1, A1:B10, Sheet1!A1:B10");
      }
    }
    if (fn === "sheets" || fn === "worksheets" || /시트/.test(ed.label)) {
      if (/[\[\]\*\/\\\?:]/.test(text)) {
        warnings.push("엑셀 시트명에는 [ ] * / \\ ? : 문자를 쓸 수 없습니다.");
      }
      if (text.length > 31) warnings.push("엑셀 시트명은 31자 이하가 안전합니다.");
    }
    if (named && /file|path|folder|filename|filepath/.test(named)) {
      if (text && /[<>|]/.test(text)) warnings.push("파일 경로에 사용할 수 없는 문자가 포함되어 있습니다.");
      if (text && /\\$/.test(text) === false && /folder|path/.test(named) && !/[.][A-Za-z0-9]+$/.test(text)) {
        warnings.push("폴더 경로라면 마지막에 \\ 또는 /가 필요한지 확인하세요.");
      }
    }
  }

  return warnings;
}

function formatDisplayValue(ed, value) {
  if (ed.kind === "string") return `"${value}"`;
  return String(value);
}

function renderChangePanel() {
  if (state.edits.size === 0) return "";
  const changed = state.editables.filter(ed => state.edits.has(ed.id));
  return `<div class="change-panel">
    <div class="change-panel-title">변경 전/후 확인 · ${changed.length}개</div>
    <ul>${changed.map(ed => {
      const cur = getCurrentValue(ed);
      return `<li>
        <span class="change-name">${escapeHtml(ed.label)}</span>
        <span class="change-values">${escapeHtml(formatDisplayValue(ed, ed.value))} → ${escapeHtml(formatDisplayValue(ed, cur))}</span>
      </li>`;
    }).join("")}</ul>
  </div>`;
}

function updateChangePanel() {
  const existing = $controls.querySelector(".change-panel");
  const html = renderChangePanel();
  if (!html) {
    if (existing) existing.remove();
    return;
  }
  if (existing) {
    existing.outerHTML = html;
  } else {
    $controls.insertAdjacentHTML("afterbegin", html);
  }
}

function analyze() {
  try {
    const parsed = tokenize(state.source);
    annotateLines(parsed);
    state.editables = extract(parsed);
    state.summary = summarize(parsed);
    state.risks = analyzeRisks(parsed);
    return true;
  } catch (e) {
    console.error(e);
    state.editables = [];
    state.summary = [];
    state.risks = [];
    setStatus("분석 오류: " + e.message, "error");
    return false;
  }
}

function renderSummary() {
  if (!state.source.trim()) {
    $summary.innerHTML = `<div class="summary-empty">아래에 VBA 코드를 붙여넣으면 여기에 한국어 요약이 나타나요</div>`;
    return;
  }
  const riskHtml = state.risks.length > 0
    ? `<div class="summary-alert">
        <div class="alert-title">실행 전 확인이 필요한 코드</div>
        <ul>${state.risks.map(r => `<li>${escapeHtml(r.text)}</li>`).join("")}</ul>
      </div>`
    : "";
  if (state.summary.length === 0) {
    $summary.innerHTML = riskHtml + `<div class="summary-empty">Sub / Function 정의를 찾지 못했어요</div>`;
    return;
  }
  let html = riskHtml;
  for (const s of state.summary) {
    const titleKo = s.koName && s.koName !== s.name ? s.koName : "";
    const oneLiner = s.firstComment
      ? `<div class="one-liner">${escapeHtml(s.name)}${titleKo ? ` <span style="color:var(--muted);font-weight:400;font-size:12.5px;">— ${escapeHtml(titleKo)}</span>` : ""}</div>
         <div class="desc">"${escapeHtml(s.firstComment)}"</div>`
      : `<div class="one-liner">${escapeHtml(s.name)}${titleKo ? ` <span style="color:var(--muted);font-weight:400;font-size:12.5px;">— ${escapeHtml(titleKo)}</span>` : ""}</div>`;
    html += `<div class="summary-card">${oneLiner}`;
    if (s.actions.length > 0) {
      html += `<ul>` + s.actions.map(a => `<li>${escapeHtml(a)}</li>`).join("") + `</ul>`;
    } else {
      html += `<ul><li style="color:var(--dim);">자동으로 인식한 동작이 없어요</li></ul>`;
    }
    if (s.forCount > 0 || s.ifCount > 0) {
      const meta = [];
      if (s.forCount > 0) meta.push(`반복 ${s.forCount}회`);
      if (s.ifCount > 0) meta.push(`조건 분기 ${s.ifCount}개`);
      html += `<div class="meta">${escapeHtml(meta.join(" · "))}</div>`;
    }
    html += `</div>`;
  }
  $summary.innerHTML = html;
}

function renderControls() {
  if (!state.source.trim()) {
    $controls.innerHTML = `<div class="empty-state">
      <div class="big">·</div>
      아직 코드를 붙여넣지 않으셨네요.<br>
      왼쪽 칸에 매크로 코드를 붙여 넣으면<br>
      바꿀 수 있는 값들을 자동으로 찾아 보여드릴게요.
    </div>`;
    return;
  }
  if (state.editables.length === 0) {
    $controls.innerHTML = `<div class="notice">
      <b>자동으로 인식한 설정값이 없어요.</b><br>
      이 매크로는 사용자가 만질 만한 분명한 값(상수, 시트명, 파일명 등)을 갖고 있지 않거나,
      값이 변수에 가려져 있어요.<br><br>
      코드를 만든 사람(또는 AI)에게 이렇게 표시해 달라고 요청해 보세요:<br>
      <code style="display:inline-block;margin-top:8px;padding:8px 10px;background:rgba(0,0,0,0.04);border-radius:8px;font-size:12px;">' @param 마지막행 min=1 max=10000<br>Const LAST_ROW = 100</code>
    </div>`;
    return;
  }

  // tier별 분리
  const primary = state.editables.filter(e => e.tier !== "advanced");
  const advanced = state.editables.filter(e => e.tier === "advanced");

  // 카테고리별 그룹
  const groupsByCat = {};
  for (const ed of primary) {
    if (!groupsByCat[ed.category]) groupsByCat[ed.category] = [];
    groupsByCat[ed.category].push(ed);
  }

  let html = renderChangePanel();

  // 메인 그룹
  for (const cat of CATEGORY_ORDER) {
    const items = groupsByCat[cat];
    if (!items || items.length === 0) continue;
    html += renderGroup(CATEGORY_NAMES[cat], items);
  }

  // 고급 섹션
  if (advanced.length > 0) {
    const advByCat = {};
    for (const ed of advanced) {
      if (!advByCat[ed.category]) advByCat[ed.category] = [];
      advByCat[ed.category].push(ed);
    }
    html += `<details class="advanced">
      <summary>고급 설정 <span class="hint">— ${advanced.length}개. 코드 내부 값일 가능성이 높아 만지지 않는 것이 안전해요.</span></summary>`;
    for (const cat of CATEGORY_ORDER) {
      const items = advByCat[cat];
      if (!items || items.length === 0) continue;
      html += renderGroup(CATEGORY_NAMES[cat], items);
    }
    html += `</details>`;
  }

  $controls.innerHTML = html;
  for (const ed of state.editables) bindWidget(ed);
}

function renderGroup(title, items) {
  let html = `<section class="group">
    <h2 class="group-title">${escapeHtml(title)} <span class="count">· ${items.length}개</span></h2>`;
  for (const ed of items) html += renderWidget(ed);
  html += `</section>`;
  return html;
}

function getCurrentValue(ed) {
  if (!state.edits.has(ed.id)) return ed.value;
  const raw = state.edits.get(ed.id);
  if (ed.kind === "number") return Number(raw);
  if (ed.kind === "string") return raw.slice(1, -1).replace(/""/g, '"');
  if (ed.kind === "bool") return raw.toLowerCase() === "true";
}

function renderWidget(ed) {
  const changed = state.edits.has(ed.id);
  const value = getCurrentValue(ed);
  let control = "";

  if (ed.kind === "number") {
    const step = ed.hint.step ?? (Number.isInteger(value) ? 1 : 0.1);
    const minAttr = typeof ed.hint.min === "number" ? `min="${ed.hint.min}"` : "";
    const maxAttr = typeof ed.hint.max === "number" ? `max="${ed.hint.max}"` : "";
    control = `<div class="number-stepper">
      <button class="stepper-btn" data-id="${ed.id}" data-role="dec" type="button">−</button>
      <input type="number" data-id="${ed.id}" data-role="num" value="${value}" step="${step}" ${minAttr} ${maxAttr}>
      <button class="stepper-btn" data-id="${ed.id}" data-role="inc" type="button">+</button>
    </div>`;
  } else if (ed.kind === "string") {
    if (ed.hint.options) {
      control = `<select class="text-input" data-id="${ed.id}" data-role="select">${
        ed.hint.options.map(o => `<option value="${escapeHtml(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")
      }</select>`;
    } else {
      control = `<input type="text" class="text-input" data-id="${ed.id}" data-role="text" value="${escapeHtml(value)}">`;
    }
  } else if (ed.kind === "bool") {
    control = `<label class="toggle">
      <input type="checkbox" data-id="${ed.id}" data-role="check" ${value ? "checked" : ""}>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-text" data-role="check-label">${value ? "켜짐" : "꺼짐"}</span>
    </label>`;
  }

  const origDisplay = ed.kind === "string" ? `"${escapeHtml(ed.value)}"` : escapeHtml(String(ed.value));
  const newDisplay = ed.kind === "string" ? `"${escapeHtml(value)}"` : escapeHtml(String(value));
  const diffLine = changed
    ? `<div class="diff-chip"><span class="ov">${origDisplay}</span> <span class="arr">→</span> <span class="nv">${newDisplay}</span></div>`
    : "";

  const tierBadge = ed.tier === "caution"
    ? `<span class="badge" style="background:rgba(230,168,90,0.15);color:#b87a30;">조심</span>`
    : ed.tier === "advanced"
      ? `<span class="badge" style="background:rgba(232,138,135,0.12);color:var(--danger);">코드 내부</span>`
      : "";

  const descLine = ed.description
    ? `<div class="setting-desc">${escapeHtml(ed.description)}</div>`
    : "";

  const helpLine = ed.beginnerHint
    ? `<div class="setting-help">${escapeHtml(ed.beginnerHint)}</div>`
    : "";

  const validation = validateEditableValue(ed, value);
  const validationLine = `<div class="validation-warning ${validation.length ? "visible" : ""}" data-role="validation">${
    validation.map(escapeHtml).join("<br>")
  }</div>`;

  const roleLine = ed.lineRole
    ? `<div class="line-role">${escapeHtml(ed.lineRole)}</div>`
    : "";

  return `<div class="card ${changed ? "changed" : ""}" data-widget-id="${ed.id}">
    <div class="setting-label">
      <span>${escapeHtml(ed.label)}</span>
      ${tierBadge}
      <span class="changed-chip" style="${changed ? "" : "display:none"}">변경됨</span>
    </div>
    ${descLine}
    ${control}
    ${helpLine}
    ${validationLine}
    <div data-role="diff-slot">${diffLine}</div>
    ${roleLine}
  </div>`;
}

function bindWidget(ed) {
  const root = $controls.querySelector(`[data-widget-id="${ed.id}"]`);
  if (!root) return;

  // 카드 어디든 클릭하면 코드의 해당 줄 강조
  root.addEventListener("click", (e) => {
    highlightInSource(ed);
  });

  if (ed.kind === "number") {
    const num = root.querySelector('[data-role="num"]');
    const dec = root.querySelector('[data-role="dec"]');
    const inc = root.querySelector('[data-role="inc"]');
    const step = ed.hint.step ?? (Number.isInteger(ed.value) ? 1 : 0.1);
    const clamp = (v) => {
      if (typeof ed.hint.min === "number" && v < ed.hint.min) v = ed.hint.min;
      if (typeof ed.hint.max === "number" && v > ed.hint.max) v = ed.hint.max;
      return v;
    };
    if (num) num.addEventListener("input", () => {
      const v = clamp(Number(num.value));
      if (Number.isFinite(v)) setEdit(ed, v);
    });
    if (dec) dec.addEventListener("click", () => {
      const v = clamp(Number(num.value) - step);
      num.value = v; setEdit(ed, v);
    });
    if (inc) inc.addEventListener("click", () => {
      const v = clamp(Number(num.value) + step);
      num.value = v; setEdit(ed, v);
    });
  } else if (ed.kind === "string") {
    const t = root.querySelector('[data-role="text"]') || root.querySelector('[data-role="select"]');
    if (t) {
      t.addEventListener("input", () => setEdit(ed, t.value));
      t.addEventListener("change", () => setEdit(ed, t.value));
    }
  } else if (ed.kind === "bool") {
    const c = root.querySelector('[data-role="check"]');
    const lbl = root.querySelector('[data-role="check-label"]');
    if (c) c.addEventListener("change", () => {
      setEdit(ed, c.checked);
      if (lbl) lbl.textContent = c.checked ? "켜짐" : "꺼짐";
    });
  }
}

function setEdit(ed, value) {
  let same = false;
  if (ed.kind === "number") same = Number(value) === Number(ed.value);
  else if (ed.kind === "bool") same = Boolean(value) === Boolean(ed.value);
  else same = String(value) === String(ed.value);

  if (same) state.edits.delete(ed.id);
  else state.edits.set(ed.id, valueToRaw(ed.kind, value));

  // 좌측 코드 갱신
  const newSrc = renderSource(state.source, state.editables, state.edits);
  suppressInput = true;
  $src.value = newSrc;
  suppressInput = false;

  // 위젯 시각 상태
  const root = $controls.querySelector(`[data-widget-id="${ed.id}"]`);
  if (root) {
    root.classList.toggle("changed", state.edits.has(ed.id));
    const chip = root.querySelector(".changed-chip");
    if (chip) chip.style.display = state.edits.has(ed.id) ? "" : "none";

    // diff 갱신
    const slot = root.querySelector('[data-role="diff-slot"]');
    if (slot) {
      if (state.edits.has(ed.id)) {
        const cur = getCurrentValue(ed);
        const ov = ed.kind === "string" ? `"${escapeHtml(ed.value)}"` : escapeHtml(String(ed.value));
        const nv = ed.kind === "string" ? `"${escapeHtml(cur)}"` : escapeHtml(String(cur));
        slot.innerHTML = `<div class="diff-chip"><span class="ov">${ov}</span> <span class="arr">→</span> <span class="nv">${nv}</span></div>`;
      } else slot.innerHTML = "";
    }

    const validation = root.querySelector('[data-role="validation"]');
    if (validation) {
      const warnings = validateEditableValue(ed, getCurrentValue(ed));
      validation.innerHTML = warnings.map(escapeHtml).join("<br>");
      validation.classList.toggle("visible", warnings.length > 0);
    }
  }

  updateChangePanel();
  $reset.disabled = state.edits.size === 0;
  setStatus(
    state.edits.size === 0
      ? `${state.editables.length}개 설정 인식됨 · 변경 없음`
      : `${state.editables.length}개 인식 · ${state.edits.size}개 변경됨`,
    "good"
  );
}

function refreshAnalysis(successPrefix = "") {
  state.source = $src.value;
  state.edits.clear();
  $reset.disabled = true;
  if (!analyze()) {
    renderSummary();
    renderControls();
    return;
  }
  renderSummary();
  renderControls();
  if (!state.source.trim()) {
    setStatus("대기 중 — 코드를 붙여넣으세요");
  } else {
    const n = state.editables.length;
    const adv = state.editables.filter(e => e.tier === "advanced").length;
    const main = n - adv;
    const risk = state.risks.length > 0 ? ` · 확인 필요 ${state.risks.length}개` : "";
    const prefix = successPrefix ? successPrefix + " · " : "";
    setStatus(
      n > 0 ? `${prefix}${main}개 설정 인식됨${adv > 0 ? ` (+ 고급 ${adv}개)` : ""}${risk}` : `${prefix}설정값 자동 인식 실패${risk}`,
      n > 0 ? "good" : ""
    );
  }
}

$src.addEventListener("input", () => {
  if (suppressInput) return;
  if (analyzeTimer) clearTimeout(analyzeTimer);
  setStatus("분석 중…");
  analyzeTimer = setTimeout(() => {
    refreshAnalysis();
  }, 250);
});

function initSamples() {
  if (!$sampleSelect) return;
  for (const sample of SAMPLE_CODES) {
    const opt = document.createElement("option");
    opt.value = sample.id;
    opt.textContent = sample.label;
    $sampleSelect.appendChild(opt);
  }
  $sampleSelect.addEventListener("change", () => {
    const sample = SAMPLE_CODES.find(s => s.id === $sampleSelect.value);
    if (!sample) return;
    suppressInput = true;
    $src.value = sample.code;
    suppressInput = false;
    $highlight.classList.remove("visible");
    activeHighlightLine = null;
    refreshAnalysis("샘플 불러옴");
  });
}

$copy.addEventListener("click", async () => {
  const text = $src.value;
  try {
    await navigator.clipboard.writeText(text);
    setStatus("클립보드에 복사됐어요 — Excel VBA 편집기에 붙여넣어 주세요", "good");
  } catch {
    $src.select();
    try { document.execCommand("copy"); setStatus("복사됐어요", "good"); }
    catch { setStatus("복사 실패 — 직접 선택해 복사해 주세요", "error"); }
  }
});

$reset.addEventListener("click", () => {
  if (state.edits.size === 0) return;
  state.edits.clear();
  suppressInput = true;
  $src.value = state.source;
  suppressInput = false;
  renderControls();
  $reset.disabled = true;
  setStatus("모든 변경을 되돌렸어요", "good");
});

initSamples();
</script>
</body>
</html>
